name: Deploy website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - name: Create initial page
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Embodied AI Roadmap</title>
          <style>
          body{max-width:800px;margin:80px auto;padding:24px;
          font-family:system-ui;line-height:1.8;background:#101828;color:#fff}
          h1{color:#78e0cf}p{color:#cbd5e1}
          </style>
          <h1>Embodied AI Roadmap</h1>
          <h2>具身智能学习手册</h2>
          <p>网站发布链路已打通。</p>
          <p>学习路线、知识分类、论文解读与每日更新正在建设中。</p>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

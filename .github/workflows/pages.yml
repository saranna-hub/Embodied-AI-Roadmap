name: Build and deploy handbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check and build
        run: npm run build
      - name: Audit rendered pages (diagnostic)
        continue-on-error: true
        run: npm run validate:render
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published website and four technical pages
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://saranna-hub.github.io/Embodied-AI-Roadmap"
          for route in \
            "/" \
            "/02-data-engineering/hifi-umi-deep/" \
            "/02-data-engineering/kiwi-deep/" \
            "/02-data-engineering/monoego-deep/" \
            "/02-data-engineering/ego-oscar-deep/" \
            "/02-data-engineering/capture-systems-comparison/" \
            "/00-prerequisites/transformer/" \
            "/01-foundations/vla/pi0/"; do
            echo "Checking $ROOT$route"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$route" -o /tmp/roadmap-page.html
            test "$(wc -c < /tmp/roadmap-page.html)" -gt 1200
            if grep -q 'katex-error' /tmp/roadmap-page.html; then
              echo "KaTeX rendering error at $route"; exit 1
            fi
            if [[ "$route" == *"-deep/" ]]; then
              grep -q 'BOM' /tmp/roadmap-page.html
              grep -q '复现' /tmp/roadmap-page.html
            fi
          done
          for name in hifi-umi kiwi monoego ego-oscar; do
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --silent --show-error "$ROOT/diagrams/${name}-system.svg" \
              -o /tmp/roadmap-diagram.svg
            grep -q '<svg' /tmp/roadmap-diagram.svg
          done
          echo "Live GitHub Pages validation passed."

name: Build and deploy handbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check and build
        run: npm run build
      - name: Audit rendered pages (diagnostic)
        run: npm run validate:render
      - name: Validate executable EGO UMI synthetic pose benchmark
        run: |
          python -m pip install --quiet numpy opencv-python-headless
          python examples/ego_umi_pose_qc_demo.py | tee /tmp/ego-umi-synthetic.log
          grep -q 'p95 reprojection=' /tmp/ego-umi-synthetic.log
          grep -q 'p95 world tool translation=' /tmp/ego-umi-synthetic.log
      - name: Validate Pi05 LIBERO action contract without GPU
        run: |
          set -euo pipefail
          python3 examples/pi05_libero_contract_demo.py | tee /tmp/pi05-libero-contract.log
          grep -q 'PASS delta-contract:' /tmp/pi05-libero-contract.log
          grep -q 'PASS q01/q99 normalization' /tmp/pi05-libero-contract.log
          grep -q 'PASS loss denominator:' /tmp/pi05-libero-contract.log
          grep -q 'PASS ALL:' /tmp/pi05-libero-contract.log
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify all published HTML, math, SVGs and favicon
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://saranna-hub.github.io/Embodied-AI-Roadmap"
          check_html() {
            local route="$1" expected="$2" actual
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$route" -o /tmp/roadmap-page.html
            test "$(wc -c < /tmp/roadmap-page.html)" -gt 1200
            if grep -q 'katex-error' /tmp/roadmap-page.html; then
              echo "FAIL KaTeX $route"; exit 1
            fi
            actual=$( (grep -o 'class="katex"' /tmp/roadmap-page.html || true) | wc -l | tr -d '[:space:]')
            if (( actual < expected )); then
              echo "FAIL KaTeX count $route: $actual < $expected"; exit 1
            fi
            if [[ "$route" == /02-data-engineering/* && "$route" == *"-deep/" ]]; then
              grep -q 'BOM' /tmp/roadmap-page.html || { echo "FAIL BOM $route"; exit 1; }
              grep -q '复现' /tmp/roadmap-page.html || { echo "FAIL Reproduction $route"; exit 1; }
              grep -q '数据' /tmp/roadmap-page.html || { echo "FAIL Data content $route"; exit 1; }
            fi
            echo "PASS HTML $route KaTeX=$actual expected>=$expected"
          }
          check_html "/" 0
          check_html "/00-prerequisites/transformer/" 5
          check_html "/02-data-engineering/hifi-umi-deep/" 1
          check_html "/02-data-engineering/kiwi-deep/" 1
          check_html "/02-data-engineering/monoego-deep/" 1
          check_html "/02-data-engineering/ego-oscar-deep/" 0
          check_html "/02-data-engineering/capture-systems-comparison/" 0
          check_html "/01-foundations/vla/pi0/" 4
          check_html "/01-foundations/vla/delta-flow-matching/" 12
          check_html "/01-foundations/vla/pi0-joint-attention-code-audit/" 8
          check_html "/01-foundations/vla/pi-series-deep-guide/" 1
          check_html "/01-foundations/vla/pi0-fast/" 1
          check_html "/01-foundations/vla/pi05-deep/" 1
          check_html "/01-foundations/vla/pi06-recap-deep/" 1
          check_html "/01-foundations/vla/pi07-deep/" 1
          check_html "/04-human-to-robot/human-robot-complete-route/" 1
          check_html "/04-human-to-robot/human-robot-emergence-deep/" 1
          check_html "/04-human-to-robot/ego-pi-deep/" 1
          check_html "/04-human-to-robot/egoengine-deep/" 1
          check_html "/04-human-to-robot/egoengine-code-reproduction/" 1
          check_html "/04-human-to-robot/ego-rgb-only-to-pi05/" 8
          check_html "/02-data-engineering/ego-umi-spatiotemporal-calibration/" 15
          for name in hifi-umi kiwi monoego ego-oscar; do
            for kind in system detail; do
              file="/diagrams/$name-$kind.svg"
              curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
                --max-time 25 --silent --show-error "$ROOT$file" \
                -o /tmp/roadmap-diagram.svg
              grep -q '<svg' /tmp/roadmap-diagram.svg
              grep -q '</svg>' /tmp/roadmap-diagram.svg
              echo "PASS SVG $file"
            done
          done
          curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
            --max-time 25 --silent --show-error "$ROOT/favicon.svg" \
            -o /tmp/roadmap-favicon.svg
          grep -q '<svg' /tmp/roadmap-favicon.svg
          grep -q '</svg>' /tmp/roadmap-favicon.svg
          echo "PASS FAVICON /favicon.svg"
          for name in delta-flow-architecture delta-flow-timeline; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" \
              -o /tmp/delta-flow-diagram.svg
            grep -q '<svg' /tmp/delta-flow-diagram.svg
            grep -q '</svg>' /tmp/delta-flow-diagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: 8 baseline published HTML pages with KaTeX counts, 8 base SVG diagrams and favicon."
          echo "PASS: Delta-Flow ninth HTML with KaTeX counts and 2 additional SVG diagrams."
          for name in pi0-joint-attention-dataflow pi0-joint-attention-mask; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" \
              -o /tmp/pi0-code-audit-diagram.svg
            grep -q '<svg' /tmp/pi0-code-audit-diagram.svg
            grep -q '</svg>' /tmp/pi0-code-audit-diagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: π₀ source-audit tenth HTML with KaTeX >= 8 and 2 additional SVG diagrams."
          for name in pi-series-evolution egoengine-repro-graph; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/roadmap-newdiagram.svg
            grep -q '<svg' /tmp/roadmap-newdiagram.svg
            grep -q '</svg>' /tmp/roadmap-newdiagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: π series and 5 human-to-robot deep pages, 2 additional SVG diagrams."
          file="/diagrams/ego-rgb-only-training-routes.svg"
          curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
            --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/ego-rgb-only-diagram.svg
          grep -q '<svg' /tmp/ego-rgb-only-diagram.svg
          grep -q '</svg>' /tmp/ego-rgb-only-diagram.svg
          echo "PASS SVG $file"
          echo "PASS: RGB-only EGO tutorial HTML/KaTeX and supervision flow diagram."
          for name in ego-umi-calibration-chain ego-umi-calibration-qc; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/ego-umi-calibration.svg
            grep -q '<svg' /tmp/ego-umi-calibration.svg
            grep -q '</svg>' /tmp/ego-umi-calibration.svg
            echo "PASS SVG $file"
          done
          echo "PASS: EGO UMI calibration tutorial HTML/KaTeX and both new diagrams."
          check_html "/01-foundations/vla/pi05-libero-data-loss-lora-source-guide/" 9
          for name in pi05-libero-contract-pipeline pi05-libero-loss-mask; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/pi05-libero-diagram.svg
            grep -q '<svg' /tmp/pi05-libero-diagram.svg
            grep -q '</svg>' /tmp/pi05-libero-diagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: π0.5 LIBERO data contract tutorial HTML/KaTeX and 2 diagrams."


name: Build and deploy handbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check and build
        run: npm run build
      - name: Audit rendered pages (blocking, site-wide)
        run: npm run validate:render
      - name: Validate executable EGO UMI synthetic pose benchmark
        run: |
          python -m pip install --quiet numpy "opencv-python-headless>=4.13,<5"
          python -c "import cv2; assert hasattr(cv2, 'calibrateHandEye'); print('OpenCV HandEye API OK', cv2.__version__)"
          python examples/ego_umi_pose_qc_demo.py | tee /tmp/ego-umi-synthetic.log
          grep -q 'p95 reprojection=' /tmp/ego-umi-synthetic.log
          grep -q 'p95 world tool translation=' /tmp/ego-umi-synthetic.log
      - name: Validate Pi05 LIBERO action contract without GPU
        run: |
          set -euo pipefail
          python3 examples/pi05_libero_contract_demo.py | tee /tmp/pi05-libero-contract.log
          grep -q 'PASS delta-contract:' /tmp/pi05-libero-contract.log
          grep -q 'PASS q01/q99 normalization' /tmp/pi05-libero-contract.log
          grep -q 'PASS loss denominator:' /tmp/pi05-libero-contract.log
          grep -q 'PASS ALL:' /tmp/pi05-libero-contract.log
      - name: Validate PACT-VLA FlowRes synthetic contract without GPU
        run: |
          set -euo pipefail
          python3 examples/pact_flowres_cpu_demo.py | tee /tmp/pact-flowres-cpu.log
          grep -q 'PASS precommit switches candidate:' /tmp/pact-flowres-cpu.log
          grep -q 'PASS masked 7 of 32 dims:' /tmp/pact-flowres-cpu.log
          grep -q 'PASS executed 5 of 50 positions scored' /tmp/pact-flowres-cpu.log
          grep -q 'PASS latency bucket:' /tmp/pact-flowres-cpu.log
          grep -q 'PASS ALL:' /tmp/pact-flowres-cpu.log
      - name: Validate MINERVA CPU synthetic evaluation contract
        run: |
          set -euo pipefail
          python3 examples/minerva_eval_contract_demo.py | tee /tmp/minerva-contract.log
          grep -q 'PASS H/K/E distinct:' /tmp/minerva-contract.log
          grep -q 'PASS temporal ensemble:' /tmp/minerva-contract.log
          grep -q 'PASS episode boundary:' /tmp/minerva-contract.log
          grep -q 'PASS Wilson interval:' /tmp/minerva-contract.log
          grep -q 'PASS task-ID permutation:' /tmp/minerva-contract.log
          grep -q 'PASS ALL:' /tmp/minerva-contract.log
      - name: Validate WING camera and spectral guidance CPU contract
        run: |
          set -euo pipefail
          python3 examples/wing_spectral_contract_demo.py | tee /tmp/wing-spectral-contract.log
          grep -q 'PASS camera motion removed:' /tmp/wing-spectral-contract.log
          grep -q 'PASS interaction residual retained:' /tmp/wing-spectral-contract.log
          grep -q 'PASS DCT and spectral bandwidth:' /tmp/wing-spectral-contract.log
          grep -q 'PASS no-future inference contract:' /tmp/wing-spectral-contract.log
          grep -q 'PASS ALL:' /tmp/wing-spectral-contract.log
      - name: Validate EgoLAP language action / attention / flow / GRPO CPU contracts
        run: |
          set -euo pipefail
          python3 examples/egolap_contract_cpu_demo.py | tee /tmp/egolap-contract.log
          grep -q 'PASS canonical coordinates and language action quantization:' /tmp/egolap-contract.log
          grep -q 'PASS three-block causal mask prevents cross-layer target leakage:' /tmp/egolap-contract.log
          grep -q 'PASS flow orientation and 10-step inverse Euler oracle:' /tmp/egolap-contract.log
          grep -q 'PASS stochastic reason context/loss masks:' /tmp/egolap-contract.log
          grep -q 'PASS deterministic demonstration-matching reward and group advantage:' /tmp/egolap-contract.log
          grep -q 'PASS ALL:' /tmp/egolap-contract.log
      - name: Validate HuRo robotization action and coordinate CPU contracts
        run: |
          set -euo pipefail
          python3 examples/huro_contract_cpu_demo.py | tee /tmp/huro-contract.log
          grep -q 'PASS SE3 camera-to-world-to-base and inverse:' /tmp/huro-contract.log
          grep -q 'PASS next absolute state and per-episode isolation:' /tmp/huro-contract.log
          grep -q 'PASS absolute-delta roundtrip and terminal repeat:' /tmp/huro-contract.log
          grep -q 'PASS invalid overlay/IK/time rejection:' /tmp/huro-contract.log
          grep -q 'PASS source-clip split leakage detector:' /tmp/huro-contract.log
          grep -q 'PASS ALL: HuRo CPU contracts' /tmp/huro-contract.log
      - name: Validate FlashVLA streaming Flow/Mask/async CPU contracts
        run: |
          set -euo pipefail
          python3 examples/flashvla_streaming_contract_cpu_demo.py | tee /tmp/flashvla-contract.log
          grep -q 'PASS packed training tensor:' /tmp/flashvla-contract.log
          grep -q 'PASS chunk-causal and cross-configuration attention masks' /tmp/flashvla-contract.log
          grep -q 'PASS inverse Euler oracle:' /tmp/flashvla-contract.log
          grep -q 'PASS async windows:' /tmp/flashvla-contract.log
          grep -q 'PASS ALL: FlashVLA CPU contracts' /tmp/flashvla-contract.log
      - name: Validate UMI Tracker Hand-Eye and pivot CPU contracts
        run: |
          set -euo pipefail
          python3 examples/umi_tracker_handeye_pivot_contract.py | tee /tmp/umi-tracker-handeye.log
          grep -q 'PASS handeye:' /tmp/umi-tracker-handeye.log
          grep -q 'PASS inversion-negative-control:' /tmp/umi-tracker-handeye.log
          grep -q 'PASS pivot:' /tmp/umi-tracker-handeye.log
          grep -q 'PASS degeneracy:' /tmp/umi-tracker-handeye.log
          grep -q 'PASS timestamp-budget:' /tmp/umi-tracker-handeye.log
          grep -q 'PASS ALL: UMI Tracker' /tmp/umi-tracker-handeye.log
      - name: Validate MCAP to LeRobot v3 timestamp/episode/action CPU contracts
        run: |
          set -euo pipefail
          python3 examples/mcap_lerobot_v3_contract_cpu.py | tee /tmp/mcap-lerobot-v3-contract.log
          grep -q 'PASS affine-clock:' /tmp/mcap-lerobot-v3-contract.log
          grep -q 'PASS causal-observation:' /tmp/mcap-lerobot-v3-contract.log
          grep -q 'PASS SE3-action:' /tmp/mcap-lerobot-v3-contract.log
          grep -q 'PASS episode-mask:' /tmp/mcap-lerobot-v3-contract.log
          grep -q 'PASS source-clip-leakage:' /tmp/mcap-lerobot-v3-contract.log
          grep -q 'PASS normalization-roundtrip:' /tmp/mcap-lerobot-v3-contract.log
          grep -q 'PASS ALL: MCAP -> LeRobot v3 -> openpi synthetic data contracts' /tmp/mcap-lerobot-v3-contract.log
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify all published HTML, math, SVGs and favicon
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://saranna-hub.github.io/Embodied-AI-Roadmap"
          check_html() {
            local route="$1" expected="$2" actual
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$route" -o /tmp/roadmap-page.html
            test "$(wc -c < /tmp/roadmap-page.html)" -gt 1200
            if grep -q 'katex-error' /tmp/roadmap-page.html; then
              echo "FAIL KaTeX $route"; exit 1
            fi
            actual=$( (grep -o 'class="katex"' /tmp/roadmap-page.html || true) | wc -l | tr -d '[:space:]')
            if (( actual < expected )); then
              echo "FAIL KaTeX count $route: $actual < $expected"; exit 1
            fi
            if [[ "$route" == /02-data-engineering/* && "$route" == *"-deep/" ]]; then
              grep -q 'BOM' /tmp/roadmap-page.html || { echo "FAIL BOM $route"; exit 1; }
              grep -q '复现' /tmp/roadmap-page.html || { echo "FAIL Reproduction $route"; exit 1; }
              grep -q '数据' /tmp/roadmap-page.html || { echo "FAIL Data content $route"; exit 1; }
            fi
            echo "PASS HTML $route KaTeX=$actual expected>=$expected"
          }
          check_html "/" 0
          check_html "/00-prerequisites/transformer/" 5
          check_html "/02-data-engineering/hifi-umi-deep/" 1
          check_html "/02-data-engineering/kiwi-deep/" 1
          check_html "/02-data-engineering/monoego-deep/" 1
          check_html "/02-data-engineering/ego-oscar-deep/" 0
          check_html "/02-data-engineering/capture-systems-comparison/" 0
          check_html "/01-foundations/vla/pi0/" 4
          check_html "/01-foundations/vla/delta-flow-matching/" 12
          check_html "/01-foundations/vla/pi0-joint-attention-code-audit/" 8
          check_html "/01-foundations/vla/pi-series-deep-guide/" 1
          check_html "/01-foundations/vla/pi0-fast/" 1
          check_html "/01-foundations/vla/pi05-deep/" 1
          check_html "/01-foundations/vla/pi06-recap-deep/" 1
          check_html "/01-foundations/vla/pi07-deep/" 1
          check_html "/04-human-to-robot/human-robot-complete-route/" 1
          check_html "/04-human-to-robot/human-robot-emergence-deep/" 1
          check_html "/04-human-to-robot/ego-pi-deep/" 1
          check_html "/04-human-to-robot/egoengine-deep/" 1
          check_html "/04-human-to-robot/egoengine-code-reproduction/" 1
          check_html "/04-human-to-robot/ego-rgb-only-to-pi05/" 8
          check_html "/02-data-engineering/ego-umi-spatiotemporal-calibration/" 15
          for name in hifi-umi kiwi monoego ego-oscar; do
            for kind in system detail; do
              file="/diagrams/$name-$kind.svg"
              curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
                --max-time 25 --silent --show-error "$ROOT$file" \
                -o /tmp/roadmap-diagram.svg
              grep -q '<svg' /tmp/roadmap-diagram.svg
              grep -q '</svg>' /tmp/roadmap-diagram.svg
              echo "PASS SVG $file"
            done
          done
          curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
            --max-time 25 --silent --show-error "$ROOT/favicon.svg" \
            -o /tmp/roadmap-favicon.svg
          grep -q '<svg' /tmp/roadmap-favicon.svg
          grep -q '</svg>' /tmp/roadmap-favicon.svg
          echo "PASS FAVICON /favicon.svg"
          for name in delta-flow-architecture delta-flow-timeline; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" \
              -o /tmp/delta-flow-diagram.svg
            grep -q '<svg' /tmp/delta-flow-diagram.svg
            grep -q '</svg>' /tmp/delta-flow-diagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: 8 baseline published HTML pages with KaTeX counts, 8 base SVG diagrams and favicon."
          echo "PASS: Delta-Flow ninth HTML with KaTeX counts and 2 additional SVG diagrams."
          for name in pi0-joint-attention-dataflow pi0-joint-attention-mask; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" \
              -o /tmp/pi0-code-audit-diagram.svg
            grep -q '<svg' /tmp/pi0-code-audit-diagram.svg
            grep -q '</svg>' /tmp/pi0-code-audit-diagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: π₀ source-audit tenth HTML with KaTeX >= 8 and 2 additional SVG diagrams."
          for name in pi-series-evolution egoengine-repro-graph; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/roadmap-newdiagram.svg
            grep -q '<svg' /tmp/roadmap-newdiagram.svg
            grep -q '</svg>' /tmp/roadmap-newdiagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: π series and 5 human-to-robot deep pages, 2 additional SVG diagrams."
          file="/diagrams/ego-rgb-only-training-routes.svg"
          curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
            --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/ego-rgb-only-diagram.svg
          grep -q '<svg' /tmp/ego-rgb-only-diagram.svg
          grep -q '</svg>' /tmp/ego-rgb-only-diagram.svg
          echo "PASS SVG $file"
          echo "PASS: RGB-only EGO tutorial HTML/KaTeX and supervision flow diagram."
          for name in ego-umi-calibration-chain ego-umi-calibration-qc; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/ego-umi-calibration.svg
            grep -q '<svg' /tmp/ego-umi-calibration.svg
            grep -q '</svg>' /tmp/ego-umi-calibration.svg
            echo "PASS SVG $file"
          done
          echo "PASS: EGO UMI calibration tutorial HTML/KaTeX and both new diagrams."
          check_html "/01-foundations/vla/pi05-libero-data-loss-lora-source-guide/" 9
          for name in pi05-libero-contract-pipeline pi05-libero-loss-mask; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/pi05-libero-diagram.svg
            grep -q '<svg' /tmp/pi05-libero-diagram.svg
            grep -q '</svg>' /tmp/pi05-libero-diagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: π0.5 LIBERO data contract tutorial HTML/KaTeX and 2 diagrams."
          check_html "/05-control/pact-vla-precommit-flowres/" 12
          for name in pact-vla-system pact-vla-detail; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/pact-vla-diagram.svg
            grep -q '<svg' /tmp/pact-vla-diagram.svg
            grep -q '</svg>' /tmp/pact-vla-diagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: PACT-VLA HTML/KaTeX, two new SVGs, CPU contract test and pre-existing baseline gates."
          check_html "/06-simulation/minerva-libero-capacity-and-generalization/" 10
          for name in minerva-libero-system minerva-libero-protocol; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/minerva-diagram.svg
            grep -q '<svg' /tmp/minerva-diagram.svg
            grep -q '</svg>' /tmp/minerva-diagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: MINERVA tutorial math, system/detail SVGs, CPU synthetic contract and original baseline checks."
          check_html "/04-human-to-robot/wing-ego-spectral-transfer/" 12
          for name in wing-spectral-system wing-spectral-detail; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/wing-spectral-diagram.svg
            grep -q '<svg' /tmp/wing-spectral-diagram.svg
            grep -q '</svg>' /tmp/wing-spectral-diagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: WING HTML, math, two SVGs, CPU contract, and all original gates."
          check_html "/04-human-to-robot/egolap-language-action-reasoning/" 12
          for name in egolap-system egolap-mask-gradient; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/egolap-verified.svg
            grep -q '<svg' /tmp/egolap-verified.svg
            grep -q '</svg>' /tmp/egolap-verified.svg
            echo "PASS SVG $file"
          done
          echo "PASS: EgoLAP HTML, math, two SVGs, CPU contract and original baseline gates."



          check_html "/04-human-to-robot/huro-robotization-to-vla/" 8
          for name in huro-system huro-detail; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors \
              --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/huro-verified.svg
            grep -q '<svg' /tmp/huro-verified.svg
            grep -q '</svg>' /tmp/huro-verified.svg
            echo "PASS SVG $file"
          done
          echo "PASS: HuRo tutorial HTML, KaTeX, 2 SVGs, CPU source-contract and all baseline gates."
          check_html "/05-control/flashvla-streaming-flow-action-decoding/" 15
          for name in flashvla-streaming-system flashvla-mask-timeline; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/flashvla-diagram.svg
            grep -q '<svg' /tmp/flashvla-diagram.svg
            grep -q '</svg>' /tmp/flashvla-diagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: FlashVLA HTML, KaTeX >= 15, 2 new SVGs, CPU and all previous baseline gates."
          check_html "/02-data-engineering/umi-tracker-handeye-pivot-calibration/" 20
          for name in umi-tracker-system umi-tracker-solver-detail; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/umi-tracker-diagram.svg
            grep -q '<svg' /tmp/umi-tracker-diagram.svg
            grep -q '</svg>' /tmp/umi-tracker-diagram.svg
            echo "PASS SVG $file"
          done
          echo "PASS: UMI Tracker hand-eye/pivot tutorial, KaTeX >= 20, 2 diagrams, CPU contract and baseline gates."

          check_html "/02-data-engineering/mcap-lerobot-v3-temporal-action-contract/" 12
          for name in mcap-lerobot-v3-system mcap-lerobot-v3-timing-detail; do
            file="/diagrams/$name.svg"
            curl --fail --location --retry 8 --retry-delay 10 --retry-all-errors --max-time 25 --silent --show-error "$ROOT$file" -o /tmp/mcap-lerobot-v3-audit.svg
            grep -q '<svg' /tmp/mcap-lerobot-v3-audit.svg
            grep -q '</svg>' /tmp/mcap-lerobot-v3-audit.svg
            echo "PASS SVG $file"
          done
          echo "PASS: MCAP → LeRobot v3 → π₀.₅ HTML/KaTeX, 2 new SVGs, CPU data-contract and all baseline gates."

<text x="35" y="315" fill="#fff" font-size="20">49D 物理通道分解（Python slice，左闭右开）</text>
<rect x="35" y="338" width="450" height="65" rx="10" fill="#2b5b8d"/><text x="52" y="364" fill="#fff" font-size="17">[0:23] · 本体关节与关节夹爪</text><text x="52" y="389" fill="#daefff" font-size="14">Domain-specific, mask inactive joints</text>

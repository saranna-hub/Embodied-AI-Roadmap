ont-size="20" text-anchor="middle">Action Schema/QC</text><text x="42" y="531" font-size="19">C｜输出与边界：不把软件估计当作直接传感</text><rect x="40" y="549" width="1240" height="69" rx="12" fill="#1b324b" stroke="#456985"/><text x="58" y="590" font-size="19">视觉 6 路；位姿和动作是经过重建、标定、质检后的派生数据</text></svg>
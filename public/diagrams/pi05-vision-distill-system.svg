<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-label="π0.5 单教师视觉蒸馏的训练和推理两条路径">
<defs>
<linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0d1528"/><stop offset="1" stop-color="#1b2e48"/></linearGradient>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#94b9ff"/></marker>
<marker id="t" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#6edbc4"/></marker>
<style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif} .w{fill:#f1f6ff}.sub{fill:#b7cbe4}.cap{font-size:15px}.box{stroke-width:2} .arr{stroke:#94b9ff;stroke-width:3;fill:none;marker-end:url(#a)} .teacher{stroke:#6edbc4;stroke-width:3;fill:none;stroke-dasharray:9 6;marker-end:url(#t)}</style>
</defs>
<rect x="0" y="0" width="1280" height="730" rx="25" fill="url(#g)"/>
<text x="52" y="55" font-size="30" font-weight="700" class="w">π₀.₅ 视觉蒸馏：训练时有教师，推理时仅保留学生</text>
<text x="52" y="87" font-size="16" class="sub">研究性增量｜openpi SigLIP / PaliGemma + Action Expert 不变；无未来信息输入</text>
<g text-anchor="middle">
<rect x="54" y="173" width="155" height="146" rx="16" class="box" fill="#294568" stroke="#6183ba"/>
<text x="131" y="220" font-size="24" class="w">RGB × V</text><text x="131" y="247" font-size="16" class="sub">当前时刻</text><text x="131" y="275" font-size="15" class="sub">有效相机 mask</text>
<rect x="269" y="177" width="208" height="135" rx="15" class="box" fill="#26476c" stroke="#6d9fd1"/>
<text x="373" y="217" font-size="21" class="w">openpi SigLIP</text><text x="373" y="245" font-size="17" class="sub">PaliGemma.img</text><text x="373" y="275" font-size="15" class="sub">E [B,VN,Dv]</text>
<rect x="548" y="166" width="204" height="151" rx="17" class="box" fill="#1a5a60" stroke="#6edbc4"/>
<text x="650" y="211" font-size="22" class="w">残差 Adapter</text><text x="650" y="240" font-size="17" class="sub">E + α A(LN(E))</text><text x="650" y="268" font-size="15" class="sub">E' [B,VN,Dv]</text><text x="650" y="295" font-size="14" fill="#8fefdc">训练与推理共用</text>
<rect x="818" y="166" width="185" height="152" rx="16" class="box" fill="#3d426f" stroke="#a6a6ee"/>
<text x="910" y="211" font-size="21" class="w">PaliGemma</text><text x="910" y="240" font-size="17" class="sub">视觉 / 文本 / 状态</text><text x="910" y="272" font-size="15" class="sub">Prefix KV</text>
<rect x="1056" y="171" width="175" height="149" rx="16" class="box" fill="#624a25" stroke="#edba75"/>
<text x="1144" y="211" font-size="22" class="w">Action Expert</text><text x="1144" y="238" font-size="16" class="sub">Flow Matching</text><text x="1144" y="269" font-size="15" class="sub">[B,H,Da]</text><text x="1144" y="296" font-size="14" fill="#ffe0a8">动作 chunk</text>
<rect x="290" y="458" width="244" height="129" rx="15" fill="#14524d" stroke="#6edbc4" stroke-width="2"/>
<text x="412" y="496" font-size="23" class="w">DINOv3 Teacher</text><text x="412" y="527" font-size="16" class="sub">冻结 · 当前 RGB</text><text x="412" y="557" font-size="15" fill="#9af9e1">仅训练存在</text>
<rect x="602" y="459" width="255" height="124" rx="16" fill="#184e59" stroke="#6edbc4" stroke-width="2"/>
<text x="729" y="498" font-size="21" class="w">对齐 + 蒸馏 Loss</text><text x="729" y="526" font-size="16" class="sub">patch 对齐 + camera mask</text><text x="729" y="555" font-size="15" fill="#a1f8e2">StopGrad(teacher)</text>
<rect x="947" y="452" width="270" height="142" rx="16" fill="#3d3f68" stroke="#a6a6ee" stroke-width="2"/>
<text x="1081" y="491" font-size="22" class="w">Flow Loss + 教师 Loss</text><text x="1081" y="522" font-size="16" class="sub">只在共享参数测梯度</text><text x="1081" y="550" font-size="16" class="sub">冲突时可选投影</text><text x="1081" y="573" font-size="14" fill="#d0cafe">实验性训练规则</text>
</g>
<g class="arr"><path d="M210 246 H260"/><path d="M478 246 H539"/><path d="M753 246 H809"/><path d="M1004 246 H1047"/></g>
<g class="teacher"><path d="M135 321V525H280"/><path d="M535 525H591"/><path d="M754 318V430H731V450"/><path d="M858 523H937"/></g>
<g stroke="#e6bb77" stroke-width="2.8" stroke-dasharray="6 6" fill="none"><path d="M1144 322V442"/></g>
<g font-size="15" fill="#ccd8ed"><text x="56" y="365">训练：教师对齐项通过 Adapter 回传；动作真值只用于 Flow Loss</text><text x="56" y="394">推理：沿上方实线，从图像到动作；下方教师分支全部移除</text></g>
<text x="56" y="675" font-size="16" fill="#acc4de">来源：openpi commit 215abfb + Meta DINOv3；新增模块是本站研究方案，非 π₀.₅ 官方训练结构。</text>

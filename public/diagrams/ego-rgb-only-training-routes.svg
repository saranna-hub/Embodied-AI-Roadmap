<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 880" width="1340" height="880" role="img" aria-label="仅 RGB EGO 视频的四种训练监督路径和 π0.5 动作损失的边界"><defs><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.title{font-size:32px;font-weight:bold;fill:#fff}.sub{font-size:17px;fill:#cfe0eb}.head{font-size:24px;font-weight:bold;fill:#fff}.body{font-size:18px;fill:#e4ebf3}.tiny{font-size:16px;fill:#cbd5e1}.box{stroke-width:2}</style><marker id="arr" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0 0L8 4L0 8Z" fill="#b5dfff"/></marker></defs><rect width="1340" height="880" fill="#0b1626"/><text x="670" y="55" text-anchor="middle" class="title">RGB-only EGO → π₀.₅：先识别监督，再决定训练路径</text><rect x="383" y="94" width="574" height="85" rx="14" fill="#163b56" stroke="#67c7ff" class="box"/><text x="670" y="128" class="head" text-anchor="middle">原始 RGB 视频 + 时间戳 + 相机标定</text><text x="670" y="157" class="sub" text-anchor="middle">只有像素时，缺少机器人可执行动作 A</text><path d="M670 180V219" stroke="#b5dfff" stroke-width="3" marker-end="url(#arr)"/><rect x="370" y="222" width="600" height="89" rx="13" fill="#593038" stroke="#ff9ba8" class="box"/><text x="670" y="254" class="head" text-anchor="middle">官方 π₀.₅ Flow Matching 需要目标动作 A</text><text x="670" y="288" class="body" text-anchor="middle">xₜ = t·ε + (1−t)·A；目标速度 ε−A</text><path d="M670 312V346M174 346H1165M174 346V377M500 346V377M839 346V377M1165 346V377" stroke="#b5dfff" stroke-width="3" fill="none" marker-end="url(#arr)"/><g><rect x="24" y="377" width="300" height="260" rx="12" fill="#17334f" stroke="#65c5f6" class="box"/><text x="174" y="414" text-anchor="middle" class="head">A 视觉自监督</text><text x="174" y="458" text-anchor="middle" class="body">阶段 / 未来帧 / 语义</text><text x="174" y="491" text-anchor="middle" class="body">训练视觉或条件表征</text><text x="174" y="537" text-anchor="middle" class="tiny">不直接产生动作 FM Loss</text><text x="174" y="581" text-anchor="middle" class="sub">还需 robot BC / LoRA</text></g><g><rect x="350" y="377" width="300" height="260" rx="12" fill="#1a3d39" stroke="#79d9b4" class="box"/><text x="500" y="414" text-anchor="middle" class="head">B 人类动作伪标签</text><text x="500" y="458" text-anchor="middle" class="body">手腕 6DoF / 手物关系</text><text x="500" y="491" text-anchor="middle" class="body">Human 域动作监督</text><text x="500" y="537" text-anchor="middle" class="tiny">标定 + 置信度 + 域适配</text><text x="500" y="581" text-anchor="middle" class="sub">Ego-Pi / HumanEgo 思路</text></g><g><rect x="689" y="377" width="300" height="260" rx="12" fill="#42351b" stroke="#e4be74" class="box"/><text x="839" y="414" text-anchor="middle" class="head">C UMI 动作桥接</text><text x="839" y="458" text-anchor="middle" class="body">同步腕部视觉 + 夹爪位姿</text><text x="839" y="491" text-anchor="middle" class="body">动作锚定的跨域表征</text><text x="839" y="537" text-anchor="middle" class="tiny">EGO 单独仍不自带动作</text><text x="839" y="581" text-anchor="middle" class="sub">需要配对 UMI 数据</text></g><g><rect x="1015" y="377" width="300" height="260" rx="12" fill="#3d274a" stroke="#c19df8" class="box"/><text x="1165" y="414" text-anchor="middle" class="head">D 机器人化合成</text><text x="1165" y="458" text-anchor="middle" class="body">数字孪生 / 重定向</text><text x="1165" y="491" text-anchor="middle" class="body">生成机器人 RGB + A</text><text x="1165" y="537" text-anchor="middle" class="tiny">必须验证运动学与同步</text><text x="1165" y="581" text-anchor="middle" class="sub">EgoEngine 思路</text></g><path d="M500 639V689M1165 639V689M174 639V689M839 639V689M174 689H1165M670 689V718" fill="none" stroke="#b5dfff" stroke-width="3" marker-end="url(#arr)"/><rect x="184" y="722" width="972" height="102" rx="12" fill="#23324b" stroke="#8cbbef" class="box"/><text x="670" y="762" text-anchor="middle" class="head">统一验收：动作有效率 → 小样本过拟合 → 仿真 → 受控真机</text><text x="670" y="794" text-anchor="middle" class="sub">区分论文结论、工程建议与实际跑通的实验结果；伪标签不得冒充真值</text></svg>
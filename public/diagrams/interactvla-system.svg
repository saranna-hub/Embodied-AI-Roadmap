<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img"><title>InteractVLA proposal and execution lifecycle</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172b4d}.b{font-size:19px;font-weight:700}.s{font-size:14px}.t{font-size:25px;font-weight:700}</style></defs><rect width="960" height="450" rx="14" fill="#f8fafc"/><text x="32" y="40" class="t">InteractVLA | Proposal is not execution</text><rect x="30" y="80" width="210" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="135" y="110" class="b" text-anchor="middle">Observe</text><text x="135" y="134" class="s" text-anchor="middle">RGB-D / state / version</text><rect x="280" y="80" width="210" height="76" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="385" y="110" class="b" text-anchor="middle">Agent target</text><text x="385" y="134" class="s" text-anchor="middle">pose + component mask</text><rect x="530" y="80" width="390" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="725" y="110" class="b" text-anchor="middle">Frozen VLA</text><text x="725" y="134" class="s" text-anchor="middle">native action expert / input gradient</text><path d="M240 118 L280 118" fill="none" stroke="#475569" stroke-width="2.5"  marker-end="url(#a)"/><path d="M490 118 L530 118" fill="none" stroke="#475569" stroke-width="2.5"  marker-end="url(#a)"/><rect x="530" y="200" width="390" height="76" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="725" y="230" class="b" text-anchor="middle">Soft-time + bounded correction</text><text x="725" y="254" class="s" text-anchor="middle">decode → pose error → VJP</text><path d="M725 156 L725 200" fill="none" stroke="#475569" stroke-width="2.5"  marker-end="url(#a)"/><rect x="280" y="200" width="210" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="385" y="230" class="b" text-anchor="middle">Inspect / reject</text><text x="385" y="254" class="s" text-anchor="middle">reprojection + compatibility</text><path d="M530 238 L490 238" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="30" y="200" width="210" height="76" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="135" y="230" class="b" text-anchor="middle">Revise target</text><text x="135" y="254" class="s" text-anchor="middle">new observation if stale</text><path d="M280 238 L240 238" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M135 200V178H385V156" stroke="#475569" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="280" y="320" width="210" height="78" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="385" y="350" class="b" text-anchor="middle">Execute prefix</text><text x="385" y="374" class="s" text-anchor="middle">accepted + version check</text><path d="M385 276 L385 320" fill="none" stroke="#475569" stroke-width="2.5"  marker-end="url(#a)"/><rect x="530" y="320" width="390" height="78" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="725" y="350" class="b" text-anchor="middle">Measured outcome / correction log</text><text x="725" y="374" class="s" text-anchor="middle">actual prefix ≠ proposed continuation</text><path d="M490 359 L530 359" fill="none" stroke="#475569" stroke-width="2.5"  marker-end="url(#a)"/><path d="M920 359H942V62H135V80" stroke="#475569" fill="none" marker-end="url(#a)"/><text x="30" y="430" class="s">Blue: model / inspection · Orange: target / guidance · Green: measured execution</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><title>Attention mass and semantic alignment</title><rect width="1100" height="560" rx="18" fill="#f6f9ff"/><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#17365d}.head{font-size:30px;font-weight:bold}.sub{font-size:17px}.label{font-size:21px;font-weight:bold}.small{font-size:16px}</style><text x="40" y="50" class="head">Attention mass and semantic alignment</text><text x="40" y="82" class="sub">Two complementary training losses; neither alone proves causal grounding.</text><rect x="35" y="120" width="300" height="112" rx="12" fill="#e0eeff" stroke="#6484a6"/><text x="51" y="154" class="label">Query × image keys</text><text x="51" y="184" class="small">Language / state span</text><text x="51" y="208" class="small">Exclude padded tokens</text><rect x="400" y="120" width="300" height="112" rx="12" fill="#fff0d5" stroke="#6484a6"/><text x="416" y="154" class="label">Region mass r</text><text x="416" y="184" class="small">Sum p over target patches</text><text x="416" y="208" class="small">Hinge: max(0, eta-r)^2</text><rect x="765" y="120" width="300" height="112" rx="12" fill="#dcf5e9" stroke="#6484a6"/><text x="781" y="154" class="label">Q/K gradient</text><text x="781" y="184" class="small">Increase region mass</text><text x="781" y="208" class="small">Zero once above threshold</text><rect x="35" y="310" width="300" height="112" rx="12" fill="#e0eeff" stroke="#6484a6"/><text x="51" y="344" class="label">Token features</text><text x="51" y="374" class="small">Language + visual patches</text><text x="51" y="398" class="small">Positive / negative / ignore</text><rect x="400" y="310" width="300" height="112" rx="12" fill="#fff0d5" stroke="#6484a6"/><text x="416" y="344" class="label">Mean pooling</text><text x="416" y="374" class="small">Cosine positive vs negative</text><text x="416" y="398" class="small">Pre-interaction only</text><rect x="765" y="310" width="300" height="112" rx="12" fill="#dcf5e9" stroke="#6484a6"/><text x="781" y="344" class="label">Semantic gradient</text><text x="781" y="374" class="small">Pull positive features closer</text><text x="781" y="398" class="small">Push reliable negatives away</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#526f90"/></marker></defs><path d="M335 176 L400 176" stroke="#526f90" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M700 176 L765 176" stroke="#526f90" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M335 366 L400 366" stroke="#526f90" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M700 366 L765 366" stroke="#526f90" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="40" y="485" class="label">Joint training: action loss + weighted auxiliary losses</text><text x="40" y="516" class="small">Measure absolute and image-conditional mass separately; validate object swaps.</text></svg>
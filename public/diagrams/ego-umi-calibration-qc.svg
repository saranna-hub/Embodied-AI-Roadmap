<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 865" role="img" aria-label="EGO UMI 标定及质量验证流程图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#72c7fb"/></marker></defs><style>.header{font:700 25px Arial,'Noto Sans SC',sans-serif;fill:#eef8ff}.body{font:18px Arial,'Noto Sans SC',sans-serif;fill:#d5e8f3}.label{font:700 18px Arial,'Noto Sans SC',sans-serif;fill:#a9defc}.title{font:700 34px Arial,'Noto Sans SC',sans-serif;fill:white}.foot{font:17px Arial,'Noto Sans SC',sans-serif;fill:#b6d4e4}</style><rect width="1450" height="865" fill="#101d2c"/><text x="725" y="66" text-anchor="middle" class="title">从原始传感器到可用于 VLA 监督的有效动作</text><rect x="65" y="125" width="410" height="168" rx="18" fill="#243d59" stroke="#537b9f" stroke-width="2"/><text x="270" y="161" text-anchor="middle" class="header">传感器与硬件时间戳</text><text x="270" y="197" text-anchor="middle" class="body">RGB: 曝光中点 t_cam</text><text x="270" y="225" text-anchor="middle" class="body">IMU: 高速 t_imu / 零偏</text><text x="270" y="253" text-anchor="middle" class="body">夹爪: 编码器 t_g</text><rect x="520" y="125" width="410" height="168" rx="18" fill="#254959" stroke="#537b9f" stroke-width="2"/><text x="725" y="161" text-anchor="middle" class="header">空间标定与几何观测</text><text x="725" y="197" text-anchor="middle" class="body">双目 K, D, T_LR</text><text x="725" y="225" text-anchor="middle" class="body">IMU 外参 T_CI, 时间偏置 δ</text><text x="725" y="253" text-anchor="middle" class="body">AprilTag PnP + T_UE</text><rect x="975" y="125" width="410" height="168" rx="18" fill="#4a4333" stroke="#537b9f" stroke-width="2"/><text x="1180" y="161" text-anchor="middle" class="header">标定验证与独立真值</text><text x="1180" y="197" text-anchor="middle" class="body">held-out 重投影分布</text><text x="1180" y="225" text-anchor="middle" class="body">静止工具漂移 / 手动量测</text><text x="1180" y="253" text-anchor="middle" class="body">独立位置真值和轨迹检查</text><path d="M475 210 L520 210" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><path d="M930 210 L975 210" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><rect x="110" y="399" width="555" height="166" rx="18" fill="#1f435e" stroke="#537b9f" stroke-width="2"/><text x="387.5" y="435" text-anchor="middle" class="header">统一时刻的世界系工具轨迹</text><text x="387.5" y="471" text-anchor="middle" class="body">时钟映射 + 相机/IMU 插值</text><text x="387.5" y="499" text-anchor="middle" class="body">T_WE(t), gripper(t), valid(t)</text><text x="387.5" y="527" text-anchor="middle" class="body">不填补未观测真值；保留 map_id</text><rect x="780" y="399" width="555" height="166" rx="18" fill="#4b373f" stroke="#537b9f" stroke-width="2"/><text x="1057.5" y="435" text-anchor="middle" class="header">质量门控：任一失败即拒绝该标签</text><text x="1057.5" y="471" text-anchor="middle" class="body">时钟跳变 / 锚点重定位 / PnP 双解</text><text x="1057.5" y="499" text-anchor="middle" class="body">重投影异常 / 轨迹尖峰 / 接触错位</text><text x="1057.5" y="527" text-anchor="middle" class="body">frame_valid ≠ action_supervision_valid</text><path d="M290 293 L290 399" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><path d="M1155 293 L1155 399" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><path d="M665 484 L780 484" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><rect x="305" y="669" width="840" height="100" rx="18" fill="#224d47" stroke="#537b9f" stroke-width="2"/><text x="725" y="705" text-anchor="middle" class="header">输出：训练输入 o_t + 未来 H 步 ΔT、夹爪动作、mask</text><text x="725" y="741" text-anchor="middle" class="body">训练与推理动作空间必须相同；仅可信动作进入 Flow Matching 监督</text><path d="M645 565 L645 669" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><path d="M1070 565 L890 669" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><text x="725" y="817" class="foot" text-anchor="middle">教学架构（非论文实验图）：先做几何/时序可信度，再做动作窗口化，不能仅靠小重投影误差宣称高精度。</text></svg>
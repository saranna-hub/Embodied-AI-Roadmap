<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">RTC异步控制总览</title>
<desc id="desc">执行队列、异步策略、前缀约束、时间戳验证和机器人安全执行的系统示意</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#55708b"/></marker><style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1a3653} .title{font-size:32px;font-weight:700}
.sub{font-size:16px;fill:#49637c}.h{font-size:22px;font-weight:700}.body{font-size:16px}
.box{fill:#fff;stroke:#b6cede;stroke-width:1.7;rx:14} .arr{fill:none;stroke:#55708b;stroke-width:3;marker-end:url(#arr)}
</style></defs>
<rect x="0" y="0" width="1200" height="650" fill="#f5f9fc"/>
<text x="52" y="57" class="title">RTC：策略在后台推理，控制器不停止执行</text>
<text x="53" y="86" class="sub">50 Hz 控制 tick 与 100–300 ms VLA 推理必须拆成两个时钟域</text>
<rect x="52" y="124" width="300" height="123" class="box"/>
<text x="73" y="162" class="h">01 感知 / 观测</text><text x="73" y="192" class="body">RGB · state · language</text><text x="73" y="220" class="sub">曝光时刻 / request ID</text>
<rect x="448" y="124" width="315" height="123" class="box"/>
<text x="469" y="162" class="h">02 后台 VLA / RTC</text><text x="469" y="192" class="body">生成 [H, Dₐ] 动作块</text><text x="469" y="220" class="sub">以旧计划前缀约束新计划</text>
<rect x="855" y="124" width="293" height="123" class="box"/>
<text x="876" y="162" class="h">03 动作队列</text><text x="876" y="192" class="body">丢弃 d 个过时动作</text><text x="876" y="220" class="sub">并发锁 · 时间戳 · 来源</text>
<path d="M352 183 H445" class="arr"/><path d="M764 183 H852" class="arr"/>
<rect x="855" y="311" width="293" height="112" class="box"/>
<text x="875" y="347" class="h">04 实时控制器</text><text x="875" y="378" class="body">每 Δt = 20 ms 取一个动作</text><text x="875" y="402" class="sub">限幅 / 碰撞 / 急停（工程加项）</text>
<path d="M1002 249 V309" class="arr"/>
<rect x="51" y="285" width="712" height="156" rx="16" fill="#e8f1fb" stroke="#92b8d4"/>
<text x="73" y="319" class="h">相邻 chunk 之间的三段控制语义</text>
<rect x="75" y="343" width="165" height="43" rx="7" fill="#b8d5ee"/><text x="105" y="371" class="body">硬约束 0…d−1</text>
<rect x="247" y="343" width="276" height="43" rx="7" fill="#f3d5a3"/><text x="285" y="371" class="body">软约束 d…H−s−1</text>
<rect x="530" y="343" width="201" height="43" rx="7" fill="#bfe6d8"/><text x="566" y="371" class="body">自由未来 H−s…H</text>
<text x="75" y="420" class="sub">前缀是旧计划已承诺动作，不是未来 Ground Truth</text>
<rect x="52" y="491" width="1096" height="100" rx="14" fill="#fff" stroke="#b6cede" stroke-width="1.7"/>
<text x="76" y="528" class="h">最小时间预算</text><text x="318" y="528" class="body">d ≤ H − s</text>
<text x="76" y="564" class="sub">例：H=50，已执行 s=15，延迟 d=7，旧队列剩余 35 步足以覆盖新推理</text>
<text x="52" y="628" class="sub">原创重绘 · 来源：Black et al. (2025) RTC；安全闸门为本站工业部署建议</text>
</svg>
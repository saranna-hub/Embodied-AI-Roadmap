<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770" role="img" aria-labelledby="t d">
<title id="t">MINERVA 视觉状态与动作生成架构</title><desc id="d">双相机两帧 RGB，任务 ID 经 FiLM 调制共享 CNN 后提取关键点，8D 状态编码形成条件，动作头可以 Flow Matching 或 L1 回归，最后每步重规划并时间集成。</desc>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#a7e3ff" stroke-width="2.1"/></marker></defs>
<rect width="1400" height="770" fill="#0d1727"/><rect x="24" y="22" width="1352" height="724" rx="23" fill="#13263d" stroke="#345773" stroke-width="2"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif"><text x="700" y="73" fill="#f0f7ff" font-size="32" font-weight="bold" text-anchor="middle">MINERVA：无语言编码器的 LIBERO 轻量闭环策略</text><text x="700" y="111" fill="#a5bfd8" font-size="19" text-anchor="middle">论文公开的 H=16、历史2帧、双相机、48个关键点；中间特征维度未臆造</text>
<rect x="53" y="164" width="223" height="155" rx="18" fill="#20476a" stroke="#54a2e2" stroke-width="2"/><text x="165" y="206" font-size="23" text-anchor="middle" fill="#ecf8ff">RGB 观测</text><text x="165" y="245" font-size="17" text-anchor="middle" fill="#d5e8f5">agent + wrist</text><text x="165" y="276" font-size="17" text-anchor="middle" fill="#d5e8f5">2 时刻 × 128²</text>
<rect x="316" y="164" width="220" height="155" rx="18" fill="#224862" stroke="#5eaad4" stroke-width="2"/><text x="426" y="210" font-size="22" text-anchor="middle" fill="#f4faff">共享 CNN</text><text x="426" y="247" font-size="18" text-anchor="middle" fill="#d5ebfc">4级深度可分离</text><text x="426" y="277" font-size="18" text-anchor="middle" fill="#d5ebfc">FiLM + 视角嵌入</text>
<rect x="577" y="164" width="233" height="155" rx="18" fill="#234e5c" stroke="#52b2b1" stroke-width="2"/><text x="693" y="209" font-size="22" text-anchor="middle" fill="#f0ffff">Spatial Softmax</text><text x="693" y="248" font-size="18" text-anchor="middle" fill="#d4f4f4">48 关键点 / 每视角</text><text x="693" y="277" font-size="17" text-anchor="middle" fill="#d4f4f4">从特征热图取期望</text>
<rect x="850" y="164" width="210" height="155" rx="18" fill="#38495f" stroke="#90a7ff" stroke-width="2"/><text x="955" y="210" font-size="22" text-anchor="middle" fill="#f7faff">融合条件 c</text><text x="955" y="249" font-size="18" text-anchor="middle" fill="#e1e8ff">图像 + 8D state</text><text x="955" y="278" font-size="18" text-anchor="middle" fill="#e1e8ff">+ 任务 ID + 历史</text>
<rect x="1105" y="164" width="241" height="155" rx="18" fill="#554122" stroke="#e9b85d" stroke-width="2"/><text x="1225" y="208" font-size="22" text-anchor="middle" fill="#fff0d4">动作专家</text><text x="1225" y="245" font-size="18" text-anchor="middle" fill="#fff0d4">4层 MLP-Mixer</text><text x="1225" y="276" font-size="18" text-anchor="middle" fill="#fff0d4">输出 H=16 的 chunk</text>
<g stroke="#a7e3ff" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M278 243 H307"/><path d="M539 243 H568"/><path d="M812 243 H840"/><path d="M1062 243 H1096"/></g>
<rect x="62" y="383" width="361" height="112" rx="15" fill="#334251" stroke="#a8b9ca" stroke-width="1.7"/><text x="242" y="423" fill="#e6f3ff" font-size="21" text-anchor="middle">任务 ID → 可学习向量</text><text x="242" y="456" fill="#cee0ee" font-size="17" text-anchor="middle">40 任务封闭类别，不理解开放词汇</text><path d="M405 386 C440 360 430 330 430 319" fill="none" stroke="#a7e3ff" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="476" y="383" width="331" height="112" rx="15" fill="#334251" stroke="#a8b9ca" stroke-width="1.7"/><text x="641" y="423" fill="#e6f3ff" font-size="21" text-anchor="middle">机器人 proprioception</text><text x="641" y="456" fill="#cee0ee" font-size="17" text-anchor="middle">8D → 两层 MLP → 与视觉融合</text><path d="M808 407 C890 391 952 351 955 322" fill="none" stroke="#a7e3ff" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="870" y="383" width="477" height="112" rx="15" fill="#3e422d" stroke="#c9b76e" stroke-width="1.7"/><text x="1108" y="421" fill="#fff1cf" font-size="20" text-anchor="middle">头部训练二选一（相同输出形状）</text><text x="1108" y="458" fill="#f6e9c4" font-size="17" text-anchor="middle">FM：10次积分　｜　L1：一次前向</text><path d="M1225 324 V375" fill="none" stroke="#eed28b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="210" y="558" width="1000" height="130" rx="18" fill="#193f39" stroke="#63cdb1" stroke-width="2"/><text x="710" y="601" fill="#e3fff5" font-size="24" text-anchor="middle">部署：预测16步，实际执行 E=1 步，再获取新观测</text><text x="710" y="642" fill="#b8f2e4" font-size="19" text-anchor="middle">跨多个历史 chunk 的重叠动作做 Temporal Ensembling（论文报告的最佳方式）</text><path d="M1100 499 V546" fill="none" stroke="#b1e2cc" stroke-width="2.8" marker-end="url(#arr)"/>
<text x="700" y="721" fill="#a9c0d7" font-size="17" text-anchor="middle">教学重绘 · 跨任务泛化与真实机器人安全性必须额外评估</text>
</g></svg>
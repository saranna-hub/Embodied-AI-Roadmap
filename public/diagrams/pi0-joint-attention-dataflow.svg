<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 710" role="img" aria-label="pi0 training and cache dataflow"><rect width="1320" height="710" fill="#0d1726"/><style>text{font-family:Arial, sans-serif;fill:#eef7ff}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#91cbff"/></marker></defs><text x="42" y="60" font-size="30" font-weight="bold">π₀ 训练与推理：共享注意力运算，不共享专家参数</text><text x="42" y="92" font-size="17">依 Physical Intelligence openpi / pi0.py、gemma.py 重绘；数值取官方默认配置</text><rect x="36" y="140" rx="16" width="260" height="105" fill="#203d64" stroke="#63809d" stroke-width="2"/><text x="166" y="175" text-anchor="middle" font-size="20" font-weight="bold">图像 + 指令</text><text x="166" y="208" text-anchor="middle" font-size="15">SigLIP tokens + 文本嵌入</text><rect x="347" y="140" rx="16" width="265" height="105" fill="#23514b" stroke="#63809d" stroke-width="2"/><text x="479.5" y="175" text-anchor="middle" font-size="20" font-weight="bold">状态 / 带噪动作 / τ</text><text x="479.5" y="208" text-anchor="middle" font-size="15">状态 1 token；动作 50 tokens</text><rect x="666" y="140" rx="16" width="264" height="105" fill="#284767" stroke="#63809d" stroke-width="2"/><text x="798" y="175" text-anchor="middle" font-size="20" font-weight="bold">VLM expert</text><text x="798" y="208" text-anchor="middle" font-size="15">宽度 2048，独立 Q/K/V</text><rect x="975" y="140" rx="16" width="307" height="105" fill="#365443" stroke="#63809d" stroke-width="2"/><text x="1128.5" y="175" text-anchor="middle" font-size="20" font-weight="bold">Action expert</text><text x="1128.5" y="208" text-anchor="middle" font-size="15">宽度 1024，独立 Q/K/V</text><path d="M296 193 L666 193" stroke="#91cbff" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M612 213 L975 213" stroke="#91cbff" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="240" y="319" width="840" height="114" rx="17" fill="#493b60" stroke="#a7a0e2" stroke-width="2"/><text x="660" y="361" text-anchor="middle" font-size="24" font-weight="bold">同一层里拼接两专家 Q/K/V 的序列维，做一次 masked attention</text><text x="660" y="399" text-anchor="middle" font-size="17">Prefix Query 不可读 Suffix；Suffix Query 可读 Prefix 及本组动作</text><path d="M799 245 L799 315" stroke="#91cbff" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1128 245 L1033 317" stroke="#91cbff" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="48" y="511" rx="16" width="374" height="117" fill="#2b405f" stroke="#63809d" stroke-width="2"/><text x="235" y="546" text-anchor="middle" font-size="20" font-weight="bold">训练路径</text><text x="235" y="579" text-anchor="middle" font-size="15">整序列前向一次 + FM-MSE</text><rect x="475" y="511" rx="16" width="362" height="117" fill="#37543b" stroke="#63809d" stroke-width="2"/><text x="656" y="546" text-anchor="middle" font-size="20" font-weight="bold">推理前缀预填充</text><text x="656" y="579" text-anchor="middle" font-size="15">Prefix KV cache：一次 / 观察</text><rect x="885" y="511" rx="16" width="382" height="117" fill="#5b442c" stroke="#63809d" stroke-width="2"/><text x="1076" y="546" text-anchor="middle" font-size="20" font-weight="bold">推理去噪循环</text><text x="1076" y="579" text-anchor="middle" font-size="15">K 步更新 Suffix，复用 Prefix KV</text><path d="M465 433 L254 507" stroke="#91cbff" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M660 433 L660 507" stroke="#91cbff" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M871 433 L1076 507" stroke="#91cbff" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="43" y="679" font-size="17">注意：Suffix KV 不跨流采样步骤累积；pi05 版本中状态改由离散语言 Token 表达，且引入 AdaRMS。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 550" role="img" aria-label="SLA | 三个容易写错的接口"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#475569"/></marker></defs><rect width="1080" height="550" rx="18" fill="#f8fafc"/><g font-family="Arial, Noto Sans CJK SC, sans-serif"><text x="32" y="44" font-size="26" font-weight="bold" fill="#0f172a">SLA | 三个容易写错的接口</text><text x="32" y="72" font-size="16" fill="#475569">层门控、损失分母、动作块起点</text><path d="M187 260L187 326" stroke="#475569" stroke-width="2.4" fill="none"  marker-end="url(#arrow)"/><path d="M540 260L540 326" stroke="#475569" stroke-width="2.4" fill="none"  marker-end="url(#arrow)"/><path d="M893 260L893 326" stroke="#475569" stroke-width="2.4" fill="none"  marker-end="url(#arrow)"/><rect x="32" y="112" width="310" height="148" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="47" y="140" font-size="19" font-weight="bold" fill="#0f172a">① 非归一化门控</text><text x="47" y="166" font-size="16" fill="#334155">layer 1: q₁ × sigmoid(g₁)</text><text x="47" y="189" font-size="16" fill="#334155">layer 2: q₂ × sigmoid(g₂)</text><text x="47" y="212" font-size="16" fill="#334155">逐通道相加，不做 softmax</text><rect x="385" y="112" width="310" height="148" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="400" y="140" font-size="19" font-weight="bold" fill="#0f172a">② 有效 token 聚合</text><text x="400" y="166" font-size="16" fill="#334155">样本 A: 1 个有效，loss=1</text><text x="400" y="189" font-size="16" fill="#334155">样本 B: 3 个有效，loss=0</text><text x="400" y="212" font-size="16" fill="#334155">每样本均值 → batch 均值</text><rect x="738" y="112" width="310" height="148" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="753" y="140" font-size="19" font-weight="bold" fill="#0f172a">③ 同一动作锚点</text><text x="753" y="166" font-size="16" fill="#334155">p₀ → p₁, p₂, p₃</text><text x="753" y="189" font-size="16" fill="#334155">Δpⱼ = pⱼ − p₀</text><text x="753" y="212" font-size="16" fill="#334155">ΔRⱼ = Rⱼ R₀ᵀ</text><rect x="32" y="326" width="310" height="105" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="47" y="354" font-size="19" font-weight="bold" fill="#0f172a">错误对照</text><text x="47" y="380" font-size="16" fill="#334155">softmax 强制总权重为 1</text><text x="47" y="403" font-size="16" fill="#334155">不等价于 sigmoid</text><rect x="385" y="326" width="310" height="105" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="400" y="354" font-size="19" font-weight="bold" fill="#0f172a">错误对照</text><text x="400" y="380" font-size="16" fill="#334155">全局 token mean = 0.25</text><text x="400" y="403" font-size="16" fill="#334155">源码式 mean = 0.5</text><rect x="738" y="326" width="310" height="105" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="753" y="354" font-size="19" font-weight="bold" fill="#0f172a">错误对照</text><text x="753" y="380" font-size="16" fill="#334155">逐步 delta / 腕局部 delta</text><text x="753" y="403" font-size="16" fill="#334155">不是本论文的基坐标 delta</text><text x="32" y="525" font-size="16" fill="#475569">独立 CPU 合成验证覆盖上述差异，不能替代 GPU 或闭环评测。</text></g></svg>
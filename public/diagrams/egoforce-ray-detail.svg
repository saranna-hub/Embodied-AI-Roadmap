<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t2 d2"><title id="t2">RSS 射线最小二乘</title><desc id="d2">正常点到射线距离及退化、畸变和遮挡三类负例</desc><rect width="1200" height="630" fill="#f7fafc"/><text x="38" y="51" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#18354a">RSS | 单位射线与局部三维骨架的垂距</text><rect x="36" y="110" width="592" height="426" rx="14" fill="#e9f3fa" stroke="#a5bed3" stroke-width="2"/><text x="58" y="148" font-size="20" fill="#245477" font-weight="bold">已知相机中心 C 与观测射线 dᵢ</text><circle cx="127" cy="439" r="11" fill="#2c5274"/><text x="99" y="472" font-size="18" fill="#2c5274">C</text><path d="M127 439L570 209M127 439L570 311M127 439L570 430" fill="none" stroke="#7babc8" stroke-width="3"/><path d="M417 288L453 298L476 394" fill="none" stroke="#cc965d" stroke-width="3"/><circle cx="417" cy="288" r="9" fill="#bd794e"/><circle cx="453" cy="298" r="9" fill="#bd794e"/><circle cx="476" cy="394" r="9" fill="#bd794e"/><path d="M417 288L401 298M453 298L439 359M476 394L488 400" fill="none" stroke="#bb644d" stroke-width="3" stroke-dasharray="4 4"/><text x="288" y="229" font-size="17" fill="#385f76">观测射线</text><text x="305" y="489" font-size="18" fill="#925a32">局部 3D 点 + 平移</text><text x="60" y="515" font-size="18" fill="#315d78">Pᵢ = I − dᵢdᵢᵀ    rᵢ = Pᵢ(Jᵢ+t)</text><rect x="664" y="114" width="503" height="103" rx="12" fill="#e4f3eb" stroke="#83b99d"/><text x="685" y="149" font-size="20" font-weight="bold" fill="#246a4e">正常解：M = Σ wᵢPᵢ</text><text x="685" y="184" font-size="20" fill="#246a4e">t* = solve(M + εI, −Σ wᵢPᵢJᵢ)</text><rect x="664" y="238" width="503" height="82" rx="11" fill="#fff0e5" stroke="#e4be9f"/><text x="688" y="269" font-size="19" fill="#9b6039" font-weight="bold">退化 1：射线近似平行</text><text x="688" y="296" font-size="16" fill="#9b6039">rank(M) = 2；沿视线方向无深度信息</text><rect x="664" y="339" width="503" height="82" rx="11" fill="#fff0e5" stroke="#e4be9f"/><text x="688" y="370" font-size="19" fill="#9b6039" font-weight="bold">退化 2：错误相机模型</text><text x="688" y="397" font-size="16" fill="#9b6039">鱼眼当针孔 → 射线方向系统错误</text><rect x="664" y="440" width="503" height="82" rx="11" fill="#fff0e5" stroke="#e4be9f"/><text x="688" y="471" font-size="19" fill="#9b6039" font-weight="bold">退化 3：遮挡点权重错误</text><text x="688" y="498" font-size="16" fill="#9b6039">离群射线需 Mask / 鲁棒加权</text><text x="39" y="587" font-size="18" fill="#4f6578">单位不能混用：ray residual（米） / reprojection（像素） / CS-MPJPE（毫米）</text></svg>
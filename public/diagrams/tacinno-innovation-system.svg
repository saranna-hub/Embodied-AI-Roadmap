<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="TacInno：离线条件编码 → 策略监督 → 部署"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs><rect width="960" height="420" rx="16" fill="#f8fafc"/><g font-family="sans-serif"><text x="28" y="38" font-size="23" font-weight="bold" fill="#0f172a">TacInno：离线条件编码 → 策略监督 → 部署</text><text x="28" y="64" font-size="15" fill="#475569">未来信息仅用于生成标签；在线策略保留触觉历史，不读取未来码。</text><path d="M258 138L310 138" stroke="#475569" stroke-width="2"  marker-end="url(#a)" fill="none"/><path d="M560 138L630 138" stroke="#475569" stroke-width="2"  marker-end="url(#a)" fill="none"/><path d="M258 283L310 283" stroke="#475569" stroke-width="2"  marker-end="url(#a)" fill="none"/><path d="M560 268L630 245" stroke="#475569" stroke-width="2"  marker-end="url(#a)" fill="none"/><path d="M560 299L630 349" stroke="#475569" stroke-width="2"  marker-end="url(#a)" fill="none"/><path d="M770 171L770 212" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)" fill="none"/><path d="M910 171L935 349" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)" fill="none"/><path d="M935 349L910 349" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)" fill="none"/><rect x="28" y="105" width="230" height="66" rx="10" fill="#ffedd5" stroke="#64748b"/><text x="143" y="132" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">未来触觉 / 视觉 / 动作</text><text x="143" y="154" text-anchor="middle" font-size="13" fill="#334155">t, +5, +10, +15</text><rect x="310" y="105" width="250" height="66" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="435" y="132" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">条件时空 Transformer</text><text x="435" y="154" text-anchor="middle" font-size="13" fill="#334155">4 个 VQ slot × 16 类</text><rect x="630" y="105" width="280" height="66" rx="10" fill="#ffedd5" stroke="#64748b"/><text x="770" y="132" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">离线标签 c</text><text x="770" y="154" text-anchor="middle" font-size="13" fill="#334155">冻结 tokenizer 后写入数据集</text><rect x="28" y="250" width="230" height="66" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="143" y="277" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">当前 RGB / 语言 / 状态</text><text x="143" y="299" text-anchor="middle" font-size="13" fill="#334155">触觉历史 t-8, t-4, t</text><rect x="310" y="250" width="250" height="66" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="435" y="277" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">π₀.₅ + 触觉编码器</text><text x="435" y="299" text-anchor="middle" font-size="13" fill="#334155">60 tactile tokens</text><rect x="630" y="212" width="280" height="66" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="770" y="239" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Flow Matching 动作</text><text x="770" y="261" text-anchor="middle" font-size="13" fill="#334155">训练和部署均保留</text><rect x="630" y="316" width="280" height="66" rx="10" fill="#ffedd5" stroke="#64748b"/><text x="770" y="343" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">接触头 + 码预测头</text><text x="770" y="365" text-anchor="middle" font-size="13" fill="#334155">仅训练；部署裁剪</text></g></svg>
<rect x="824" y="124" width="349" height="180" rx="20" fill="#14364d" stroke="#48b9ce" stroke-width="2"/><text x="846" y="158" fill="#a5f3fc" font-size="22" font-family="Arial" font-weight="700">DiT + VAE video synthesis</text><text x="846" y="191" fill="#d7e5f5" font-size="17" font-family="Arial">52-channel latent conditioning</text><text x="846" y="221" fill="#d7e5f5" font-size="17" font-family="Arial">Wan 14B video prior / 61 frames</text><text x="846" y="251" fill="#d7e5f5" font-size="17" font-family="Arial">generated observation O(k)</text><text x="846" y="281" fill="#8ea9ca" font-size="14" font-family="Arial">not robot action prediction</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 620" role="img" aria-labelledby="t d"><title id="t">EgoSim continuous world state architecture</title><desc id="d">Data reconstruction produces geometric priors and action conditions. Observation synthesis feeds a gated persistent three-dimensional state update.</desc><rect width="1220" height="620" rx="26" fill="#081426"/><text x="45" y="58" fill="#f8fafc" font-family="Arial,sans-serif" font-weight="700" font-size="29">EgoSim | Action-conditioned observation and persistent 3D state</text><text x="45" y="88" fill="#9fb5d4" font-family="Arial,sans-serif" font-size="15">Source-grounded educational reconstruction · ECCV 2026</text>
<rect x="42" y="124" width="349" height="180" rx="20" fill="#142942" stroke="#38658c" stroke-width="2"/><text x="64" y="159" fill="#67e8f9" font-size="21" font-family="Arial" font-weight="700">EGO / UMI observations</text><text x="65" y="192" fill="#d7e5f5" font-size="17" font-family="Arial">RGB + timestamps + camera pose</text><text x="65" y="222" fill="#d7e5f5" font-size="17" font-family="Arial">hand keypoints / gripper skeleton</text><text x="65" y="252" fill="#d7e5f5" font-size="17" font-family="Arial">SAM3 · DA3 · HaMeR · caption</text><text x="65" y="281" fill="#8ea9ca" font-size="14" font-family="Arial">calibration &amp; QC before training</text>
<path d="M391 214 H440" stroke="#67e8f9" stroke-width="4"/><path d="M428 204 l12 10 -12 10" fill="none" stroke="#67e8f9" stroke-width="4"/>
<rect x="445" y="124" width="324" height="180" rx="20" fill="#142942" stroke="#38658c" stroke-width="2"/><text x="468" y="159" fill="#67e8f9" font-size="21" font-family="Arial" font-weight="700">Geometry + action conditions</text><text x="468" y="191" fill="#d7e5f5" font-size="17" font-family="Arial">3D point cloud (static scene)</text><text x="468" y="220" fill="#d7e5f5" font-size="17" font-family="Arial">camera-path prior + hole mask</text><text x="468" y="249" fill="#d7e5f5" font-size="17" font-family="Arial">projected hand / tool skeleton</text><text x="468" y="281" fill="#8ea9ca" font-size="14" font-family="Arial">first-frame appearance anchor</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 650" role="img" aria-label="HiFi-UMI｜采集、公共位姿和训练"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#9ac5e9"/></marker></defs><rect width="1260" height="650" rx="24" fill="#101b2e"/><style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif}</style><text x="42" y="59" font-size="29" font-weight="bold" fill="#f3f7ff">HiFi-UMI｜采集、公共位姿和训练</text><text x="43" y="100" font-size="18" fill="#b7cee5">① 原始传感器：三组输入并行采集</text><rect x="43" y="135" width="360" height="100" rx="14" fill="#254873" stroke="#88b3ce" stroke-width="2"/><text x="223" y="194" text-anchor="middle" font-size="22" font-weight="bold" fill="#f0f8ff">头戴双目 + IMU</text><path d="M223 236V280" stroke="#9ac5e9" stroke-width="3"/><rect x="443" y="135" width="360" height="100" rx="14" fill="#245649" stroke="#88b3ce" stroke-width="2"/><text x="623" y="194" text-anchor="middle" font-size="22" font-weight="bold" fill="#f0f8ff">双腕四路 RGB</text><path d="M623 236V280" stroke="#9ac5e9" stroke-width="3"/><rect x="843" y="135" width="360" height="100" rx="14" fill="#254873" stroke="#88b3ce" stroke-width="2"/><text x="1023" y="194" text-anchor="middle" font-size="22" font-weight="bold" fill="#f0f8ff">夹爪 / GPIO 触发</text><path d="M1023 236V280" stroke="#9ac5e9" stroke-width="3"/><path d="M223 280H1023" stroke="#9ac5e9" stroke-width="3" fill="none"/><path d="M223 280V353" stroke="#9ac5e9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="44" y="323" font-size="17" fill="#b7cee5">② 对齐 / 融合后处理</text><rect x="43" y="357" width="360" height="116" rx="14" fill="#284867" stroke="#88b3ce" stroke-width="2"/><text x="223" y="421" text-anchor="middle" font-size="20" font-weight="bold" fill="#f0f8ff">同步/标定/共同世界系</text><path d="M404 415H441" stroke="#9ac5e9" stroke-width="3" marker-end="url(#arrow)"/><rect x="443" y="357" width="360" height="116" rx="14" fill="#28535b" stroke="#88b3ce" stroke-width="2"/><text x="623" y="421" text-anchor="middle" font-size="20" font-weight="bold" fill="#f0f8ff">双手 6DoF + Valid</text><path d="M804 415H841" stroke="#9ac5e9" stroke-width="3" marker-end="url(#arrow)"/><rect x="843" y="357" width="360" height="116" rx="14" fill="#59462f" stroke="#88b3ce" stroke-width="2"/><text x="1023" y="421" text-anchor="middle" font-size="20" font-weight="bold" fill="#f0f8ff">LeRobot / VLA 训练</text><text x="44" y="518" font-size="19" fill="#e2edf9">③ 输出：要区分直接传感与算法估计，不能把派生轨迹视为真实传感数据</text><rect x="40" y="548" width="1180" height="65" rx="10" fill="#1d3047" stroke="#304e6b"/><text x="62" y="587" font-size="18" fill="#c5def1">六路视频直接采集；6DoF 和可执行 Action 需要重建、映射、质检</text></svg>
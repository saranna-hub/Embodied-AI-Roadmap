<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 900" role="img" aria-label="EGO UMI 标定及质量验证流程图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#72c7fb"/></marker></defs><style>.header{font:700 25px Arial,'Noto Sans SC',sans-serif;fill:#eef8ff}.body{font:18px Arial,'Noto Sans SC',sans-serif;fill:#d5e8f3}.label{font:700 18px Arial,'Noto Sans SC',sans-serif;fill:#a9defc}.title{font:700 34px Arial,'Noto Sans SC',sans-serif;fill:white}.foot{font:17px Arial,'Noto Sans SC',sans-serif;fill:#b6d4e4}</style><rect width="1450" height="900" fill="#101d2c"/><text x="725" y="65" text-anchor="middle" class="title">世界坐标 W 中恢复手持 UMI 工具位姿 T_WE</text><rect x="50" y="120" width="310" height="178" rx="18" fill="#224156" stroke="#537b9f" stroke-width="2"/><text x="205" y="156" text-anchor="middle" class="header">世界锚点 W（静止）</text><text x="205" y="192" text-anchor="middle" class="body">桌面 AprilGrid / 多个 Tag</text><text x="205" y="220" text-anchor="middle" class="body">Tag 尺寸 + ID → 世界系</text><text x="205" y="248" text-anchor="middle" class="body">必须校验板件物理尺寸</text><rect x="565" y="120" width="310" height="178" rx="18" fill="#253b59" stroke="#537b9f" stroke-width="2"/><text x="720" y="156" text-anchor="middle" class="header">头戴相机 C（可运动）</text><text x="720" y="192" text-anchor="middle" class="body">双目鱼眼 L/R + IMU</text><text x="720" y="220" text-anchor="middle" class="body">已标定内参、畸变、C-I 外参</text><text x="720" y="248" text-anchor="middle" class="body">图像曝光中点与 IMU 对齐</text><rect x="1090" y="120" width="310" height="178" rx="18" fill="#224d47" stroke="#537b9f" stroke-width="2"/><text x="1245" y="156" text-anchor="middle" class="header">UMI 标记 U（随工具动）</text><text x="1245" y="192" text-anchor="middle" class="body">腕部 AprilTag / Marker</text><text x="1245" y="220" text-anchor="middle" class="body">可观测 T_CU（PnP）</text><text x="1245" y="248" text-anchor="middle" class="body">握持末端工具外参 T_UE</text><path d="M360 201 L565 201" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><text x="462.5" y="191" class="label" text-anchor="middle">PnP 返回 T_CW</text><path d="M875 201 L1090 201" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><text x="982.5" y="191" class="label" text-anchor="middle">PnP 返回 T_CU</text><rect x="110" y="390" width="500" height="156" rx="18" fill="#1f405c" stroke="#537b9f" stroke-width="2"/><text x="360" y="426" text-anchor="middle" class="header">世界到相机：T_WC</text><text x="360" y="462" text-anchor="middle" class="body">对 PnP 的 T_CW 求逆</text><text x="360" y="490" text-anchor="middle" class="body">双目时也可用 T_Cr = T_Cl × T_ClCr</text><rect x="790" y="390" width="550" height="156" rx="18" fill="#20534d" stroke="#537b9f" stroke-width="2"/><text x="1065" y="426" text-anchor="middle" class="header">相机到工具：T_CE = T_CU × T_UE</text><text x="1065" y="462" text-anchor="middle" class="body">工具外参需单独做刚体标定</text><text x="1065" y="490" text-anchor="middle" class="body">Tag 追踪失败 → 禁止将猜测当真值</text><path d="M280 298 L280 390" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><path d="M1250 298 L1090 390" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><path d="M610 468 L790 468" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="458" class="label" text-anchor="middle">变换链</text><rect x="345" y="632" width="760" height="122" rx="18" fill="#365076" stroke="#537b9f" stroke-width="2"/><text x="725" y="668" text-anchor="middle" class="header">最终结果：T_WE(t) = T_WC(t) × T_CU(t) × T_UE</text><text x="725" y="704" text-anchor="middle" class="body">输出统一世界系手持轨迹；同步到曝光时刻；记录有效性与不确定度</text><path d="M430 546 L595 632" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020 546 L855 632" fill="none" stroke="#72c7fb" stroke-width="3" marker-end="url(#arrow)"/><text x="725" y="815" class="foot" text-anchor="middle">T_AB 表示把 B 系坐标变到 A 系：p_A = T_AB p_B；箭头是计算数据流，不是坐标轴方向。</text><text x="725" y="847" class="foot" text-anchor="middle">教学重绘 · 依据 Kalibr / OpenVINS / AprilTag / OpenCV 开放文档 · 2026-10-28</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="610" viewBox="0 0 1140 610" role="img" aria-label="Open HumanWAM 两条训练路线结构图">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1b31"/><stop offset="1" stop-color="#122e48"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#73c5f7"/></marker></defs>
<rect width="1140" height="610" rx="24" fill="url(#bg)"/><text x="36" y="49" fill="#f6fbff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Open-HumanWAM · 从 EGO 经验到可评测动作</text><text x="38" y="78" fill="#b6cade" font-family="Arial,sans-serif" font-size="16">原创教学重绘 · 训练监督与在线输入严格分离 · 2026-11-22</text>
<text x="38" y="128" fill="#90d9fe" font-family="Arial,sans-serif" font-size="21" font-weight="700">路径 A · Vanilla / Human-only Pretrain</text>
<rect x="36" y="155" width="223" height="118" rx="13" fill="#183957" stroke="#4888b9"/><text x="55" y="190" fill="#fff" font-size="19">50,000 h EGO</text><text x="55" y="224" fill="#d0e2f2" font-size="15">RGB + 语言 + 手运动</text><text x="55" y="249" fill="#aad1e4" font-size="14">质量筛选 / 来源追溯</text>
<rect x="329" y="155" width="230" height="118" rx="13" fill="#203d69" stroke="#7ab6f3"/><text x="347" y="190" fill="#fff" font-size="18">视频 DiT + Action DiT</text><text x="347" y="224" fill="#d0e2f2" font-size="15">IA / IDM 注意力消融</text><text x="347" y="249" fill="#aad1e4" font-size="14">绝对相机系 / 相对动作</text>
<rect x="628" y="155" width="210" height="118" rx="13" fill="#234e5e" stroke="#78c1ce"/><text x="648" y="190" fill="#fff" font-size="18">机器人后训练</text><text x="648" y="224" fill="#d0e2f2" font-size="15">RoboTwin clean_50</text><text x="648" y="249" fill="#aad1e4" font-size="14">固定任务/seed/预算</text>
<rect x="901" y="155" width="199" height="118" rx="13" fill="#345047" stroke="#9ed7a0"/><text x="918" y="190" fill="#fff" font-size="18">闭环评测</text><text x="918" y="224" fill="#d0e2f2" font-size="15">Clean / Scene-OOD</text><text x="918" y="249" fill="#aad1e4" font-size="14">不能外推工厂成功率</text>
<path d="M265 213H321M565 213H620M844 213H893" stroke="#73c5f7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="38" y="329" fill="#a6ffd7" font-family="Arial,sans-serif" font-size="21" font-weight="700">路径 B · Goal / Human + Robot Pretrain</text>
<rect x="36" y="356" width="223" height="120" rx="13" fill="#1a4548" stroke="#59aa98"/><text x="55" y="392" fill="#fff" font-size="18">EGO + 机器人动作</text><text x="55" y="426" fill="#d0e2f2" font-size="15">视频 / Goal / 状态</text><text x="55" y="453" fill="#aad1e4" font-size="14">含有效动作 Mask</text>
<rect x="329" y="356" width="230" height="120" rx="13" fill="#214763" stroke="#65a3cf"/><text x="347" y="391" fill="#fff" font-size="18">GoalWAM 多模态塔</text><text x="347" y="426" fill="#d0e2f2" font-size="15">文本 KV + 视频/动作</text><text x="347" y="453" fill="#aad1e4" font-size="14">SharedEEF + UniPC</text>
<rect x="628" y="356" width="210" height="120" rx="13" fill="#234e5e" stroke="#78c1ce"/><text x="648" y="391" fill="#fff" font-size="18">48-step 49D chunk</text><text x="648" y="426" fill="#d0e2f2" font-size="15">32-step 实际调度</text><text x="648" y="453" fill="#aad1e4" font-size="14">相机位姿仅输入</text>
<rect x="901" y="356" width="199" height="120" rx="13" fill="#345047" stroke="#9ed7a0"/><text x="918" y="391" fill="#fff" font-size="18">零样本 / 后训练</text><text x="918" y="426" fill="#d0e2f2" font-size="15">分别报告两个协议</text><text x="918" y="453" fill="#aad1e4" font-size="14">Goal 不能泄漏终帧</text>
<path d="M265 415H321M565 415H620M844 415H893" stroke="#73c5f7" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="514" width="1064" height="66" rx="12" fill="#122b42" stroke="#41627a"/><text x="56" y="540" fill="#ffd19b" font-family="Arial,sans-serif" font-size="16">注意：Vanilla 原始 50K 公开预训练 loader 仍含待绑定参数；Goal 的推理与 RoboTwin 后训练代码更完整。</text><text x="56" y="563" fill="#e0ecfa" font-family="Arial,sans-serif" font-size="14">论文数值、README 版本数值与手册的 CPU 合成验证分开记录；不把合成测试当 GPU 复现。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-label="StableVLA EfficientChannelAttention通道相关性计算与两流融合">
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#11182a"/><stop offset="1" stop-color="#1b2848"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8dc9ff"/></marker></defs><rect width="1280" height="750" rx="22" fill="url(#bg)"/>
<text x="46" y="52" font-family="Arial,sans-serif" font-size="28" fill="#f0f6ff" font-weight="700">通道 Gram：Attention 发生在 D×D，而不是空间 N×N</text>
<text x="48" y="86" font-family="Arial,sans-serif" font-size="16" fill="#b3ccef">B = batch · N = patch 数 · H = 16 heads · D = Cl / H</text>
<g font-family="Arial,sans-serif" text-anchor="middle" font-size="18" fill="#f6fcff">
<rect x="46" y="146" width="215" height="96" rx="14" fill="#2c4d74" stroke="#7298c4"/><text x="152" y="182">视觉嵌入 Y</text><text x="152" y="211" font-size="16">[B,N,Cl]</text>
<rect x="345" y="121" width="232" height="88" rx="14" fill="#37577e" stroke="#7698cb"/><text x="460" y="158">Q = Wq(Y)</text><text x="460" y="185" font-size="16">[B,H,D,N]</text>
<rect x="345" y="240" width="232" height="88" rx="14" fill="#37577e" stroke="#7698cb"/><text x="460" y="276">K = Y reshape</text><text x="460" y="302" font-size="16">[B,H,D,N]</text>
<rect x="647" y="165" width="234" height="121" rx="14" fill="#1a5c65" stroke="#51caba"/><text x="765" y="205">G = Q × Kᵀ / √D</text><text x="765" y="236" font-size="17">[B,H,D,D]</text><text x="765" y="260" font-size="16">跨 N 汇聚通道相关</text>
<rect x="954" y="165" width="282" height="121" rx="14" fill="#1b6260" stroke="#53d8a4"/><text x="1094" y="204">S = sigmoid(G) × T</text><text x="1094" y="235" font-size="17">独立门控，行和不恒等于 1</text><text x="1094" y="260" font-size="15">T 为可学习逐头温度</text>
<rect x="351" y="386" width="255" height="103" rx="14" fill="#40446e" stroke="#979bc4"/><text x="478" y="423">V = LN(MLP(Y))</text><text x="478" y="452" font-size="16">[B,H,D,N]</text>
<rect x="704" y="377" width="250" height="107" rx="14" fill="#4c4d73" stroke="#a9a3ed"/><text x="828" y="415">O = S × V</text><text x="828" y="440" font-size="16">[B,H,D,N]</text><text x="828" y="463" font-size="15">merge → [B,N,Cl]</text>
<rect x="978" y="380" width="259" height="111" rx="14" fill="#684b27" stroke="#e3b768"/><text x="1107" y="421">Fclean + tanh(0.3) · O</text><text x="1107" y="452" font-size="15">LayerNorm → Linear</text>
</g>
<g stroke="#8dc9ff" fill="none" stroke-width="3" marker-end="url(#a)"><path d="M261 187 L336 165"/><path d="M261 208 L336 281"/><path d="M577 164 L638 205"/><path d="M577 281 L638 240"/><path d="M881 229 L945 229"/><path d="M261 219 L341 423"/><path d="M1094 286 L915 368"/><path d="M606 438 L695 436"/><path d="M954 432 L969 432"/></g>
<rect x="48" y="552" width="1184" height="129" rx="18" fill="#20344e" stroke="#506989"/><g font-family="Arial,sans-serif" fill="#e0edff"><text x="67" y="590" font-size="19" font-weight="700">源码边界：</text><text x="67" y="625" font-size="16">• sigmoid(0)=0.5，不意味着零相关信号完全清除；softmax 归一化假设不成立。</text><text x="67" y="653" font-size="16">• “gate” 是 register_buffer(0.3) 固定值，真正融合系数 tanh(0.3) ≈ 0.2913。</text></g>
<text x="48" y="714" font-family="Arial,sans-serif" font-size="14" fill="#9fb9d4">原创教学重绘，依据 HumanNet/src/model/StableVLA/prismatic/util/nn_utils.py · 非原作者插图</text>
</svg>
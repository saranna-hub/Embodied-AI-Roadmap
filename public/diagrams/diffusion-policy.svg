<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-label="Diffusion Policy：条件动作去噪"><rect width="1000" height="290" rx="18" fill="#111b30"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif}</style><text x="32" y="43" font-size="24" font-weight="700" fill="#eff6ff">Diffusion Policy：条件动作去噪</text><rect x="30" y="95" width="173.6" height="96" rx="12" fill="#1f385d" stroke="#5c9db7"/><text x="116.8" y="134" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">当前观察</text><text x="116.8" y="162" fill="#cce5ef" text-anchor="middle" font-size="13">RGB + State</text><path d="M205.6 143 H217.6" stroke="#9dc7ed" stroke-width="2.5"/><path d="M217.6 143 l-7 -5 v10 z" fill="#9dc7ed"/><rect x="221.6" y="95" width="173.6" height="96" rx="12" fill="#1c4b53" stroke="#5c9db7"/><text x="308.4" y="134" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">观测编码器</text><text x="308.4" y="162" fill="#cce5ef" text-anchor="middle" font-size="13">视觉/状态特征</text><path d="M397.2 143 H409.2" stroke="#9dc7ed" stroke-width="2.5"/><path d="M409.2 143 l-7 -5 v10 z" fill="#9dc7ed"/><rect x="413.2" y="95" width="173.6" height="96" rx="12" fill="#1f385d" stroke="#5c9db7"/><text x="500" y="134" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">条件去噪网络</text><text x="500" y="162" fill="#cce5ef" text-anchor="middle" font-size="13">Action + k + Obs</text><path d="M588.8 143 H600.8" stroke="#9dc7ed" stroke-width="2.5"/><path d="M600.8 143 l-7 -5 v10 z" fill="#9dc7ed"/><rect x="604.8" y="95" width="173.6" height="96" rx="12" fill="#1c4b53" stroke="#5c9db7"/><text x="691.5999999999999" y="134" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">逐步采样</text><text x="691.5999999999999" y="162" fill="#cce5ef" text-anchor="middle" font-size="13">噪声 → 动作</text><path d="M780.4 143 H792.4" stroke="#9dc7ed" stroke-width="2.5"/><path d="M792.4 143 l-7 -5 v10 z" fill="#9dc7ed"/><rect x="796.4" y="95" width="173.6" height="96" rx="12" fill="#1f385d" stroke="#5c9db7"/><text x="883.1999999999999" y="134" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">执行/重规划</text><text x="883.1999999999999" y="162" fill="#cce5ef" text-anchor="middle" font-size="13">滚动时域控制</text><text x="32" y="247" font-size="15" fill="#bed3e9">扩散步数与预测动作长度是两个不同概念。</text></svg>
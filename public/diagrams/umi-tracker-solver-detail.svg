<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="手眼AX等于XB和Pivot最小二乘两种互补标定">
<rect width="1200" height="620" fill="#09172a"/><text x="49" y="56" fill="#e9f3ff" font-size="30" font-family="sans-serif" font-weight="bold">两种互补标定：Hand–Eye 与 Pivot</text>
<rect x="47" y="95" width="1104" height="203" rx="14" fill="#122943" stroke="#4f9ac9" stroke-width="2"/><text x="74" y="131" fill="#9fdcff" font-family="sans-serif" font-size="23" font-weight="bold">① Hand–Eye | 临时相机与 Tracker 必须刚性固定</text>
<g font-family="sans-serif" font-size="19" fill="#e2f4ff"><text x="80" y="177">Tracker 运动 Aᵢ = T_LUᵢ</text><text x="447" y="177">未知外参 X = T_UC</text><text x="777" y="177">固定世界板 Y = T_LM</text><text x="80" y="228" fill="#7ad4f0" font-size="25">Aᵢ X Bᵢ = Y</text><text x="440" y="228" fill="#7ad4f0" font-size="25">Aⱼ⁻¹ Aᵢ X = X Bⱼ Bᵢ⁻¹</text><text x="80" y="270" fill="#b8c9e0" font-size="16">Bᵢ = T_CᵢM (PnP 输出); 多轴激励; held-out closure 验证</text></g>
<rect x="47" y="324" width="1104" height="231" rx="14" fill="#1a3340" stroke="#56cbb7" stroke-width="2"/><text x="74" y="361" fill="#adffe7" font-family="sans-serif" font-size="23" font-weight="bold">② Pivot | 夹爪工具尖保持同一物理点，Tracker 绕尖端旋转</text>
<g font-family="sans-serif" fill="#e7fff7"><text x="80" y="410" font-size="24">Rᵢ p_U + tᵢ = p_fixed</text><text x="80" y="452" font-size="22" fill="#74e6d0">[ Rᵢ | −I ] [ p_U ; p_fixed ] = −tᵢ</text><text x="80" y="496" font-size="18" fill="#c3e4db">堆叠多姿态 → SVD / 最小二乘 → 检查 rank=6、残差、独立重复测量</text><text x="80" y="529" font-size="16" fill="#ffdeab">只能求 TCP 平移！朝向、非刚性支架、时间错配要独立处理。</text></g>
<text x="52" y="597" font-size="17" fill="#bbcae0" font-family="sans-serif">反例：EGO 头戴相机不是固定在 UMI 上，不能直接使用常量 T_UC 做 Hand–Eye。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="680" viewBox="0 0 1450 680" role="img" aria-label="FlowRes 同噪声多时刻验证和动作维度掩码">
<rect width="1450" height="680" fill="#101b2b"/>
<text x="725" y="53" fill="#f4f9ff" font-family="sans-serif" font-size="32" text-anchor="middle">FlowRes：为什么新观测能给旧候选打分？</text>
<g font-family="sans-serif" text-anchor="middle" font-size="20">
<rect x="38" y="105" width="266" height="150" rx="16" fill="#203d5d" stroke="#87c6fb" stroke-width="3"/>
<text x="171" y="156" fill="#e6f2ff">候选 A⁽ⁿ⁾ [H,D]</text>
<text x="171" y="194" fill="#cadcf2">N 组固定候选</text>
<text x="171" y="225" fill="#cadcf2">不再修改轨迹</text>
<rect x="352" y="105" width="245" height="150" rx="16" fill="#203d5d" stroke="#87c6fb" stroke-width="3"/>
<text x="475" y="155" fill="#e6f2ff">共享 εᵛᵉʳ</text>
<text x="475" y="194" fill="#cadcf2">所有候选和 τ 复用</text>
<text x="475" y="225" fill="#cadcf2">减少随机比较噪声</text>
<rect x="645" y="105" width="356" height="150" rx="16" fill="#29483d" stroke="#88e1af" stroke-width="3"/>
<text x="823" y="153" fill="#e8fff3">路径点 xτ=(1−τ)A+τε</text>
<text x="823" y="193" fill="#e8fff3">目标方向 u=ε−A</text>
<text x="823" y="230" fill="#b7dfd0">M 个 τ × N 个候选</text>
<rect x="1050" y="105" width="355" height="150" rx="16" fill="#574328" stroke="#f2ca80" stroke-width="3"/>
<text x="1227" y="151" fill="#fff3da">冻结 VLA + 新观测</text>
<text x="1227" y="190" fill="#fff3da">vθ(xτ,τ|o新)</text>
<text x="1227" y="229" fill="#eacfa4">预测方向（非 task reward）</text>
<g stroke="#aac8df" stroke-width="3" fill="none"><path d="M304 180 H352"/><path d="M597 180 H645"/><path d="M1001 180 H1050"/></g>
<rect x="100" y="343" width="1225" height="232" rx="18" fill="#1e3147" stroke="#607a95" stroke-width="2"/>
<text x="712" y="395" fill="#f7fbff" font-size="29">Eₙ = Σᵢ Σⱼ wⱼ || m ⊙ (vθ − u) ||²</text>
<text x="712" y="444" fill="#d1e8ff">时间索引：τ = 0.2 / 0.4 / 0.6 / 0.8（论文 π₀.₅ LIBERO）</text>
<text x="712" y="485" fill="#d1e8ff">动作步：仅前 5 / 50；有效动作维：7 / 32；其他维度设为 mask=0</text>
<text x="712" y="536" fill="#9ee0bd">最终：n* = argmin Eₙ → 在预定时刻提交整块（不是逐步重选）</text>
<text x="715" y="634" fill="#adc4db" font-size="18">注意：不同模型/任务需要按原文表 6 更换 τ、权重 wⱼ 和有效动作维度。</text>
</g></svg>
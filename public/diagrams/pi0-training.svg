<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" role="img" aria-label="Flow Matching 训练和推理流程"><rect width="1100" height="490" rx="20" fill="#101d30"/><text x="48" y="61" font-size="27" font-family="sans-serif" font-weight="bold" fill="#edf4ff">训练：真实动作构造目标速度</text><text x="48" y="270" font-size="27" font-family="sans-serif" font-weight="bold" fill="#edf4ff">推理：从高斯噪声积分生成动作</text><rect x="47" y="99" width="215" height="83" rx="12" fill="#275272"/><text x="155" y="147" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#eff7ff">真实动作 A</text><path d="M 265 140 h 42" stroke="#cbd9ee" stroke-width="4"/><path d="M 300 131 l 13 9 -13 9" stroke="#cbd9ee" fill="none" stroke-width="4"/><rect x="312" y="99" width="215" height="83" rx="12" fill="#5b4932"/><text x="420" y="147" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#eff7ff">噪声 ε + 时间 t</text><path d="M 530 140 h 42" stroke="#cbd9ee" stroke-width="4"/><path d="M 565 131 l 13 9 -13 9" stroke="#cbd9ee" fill="none" stroke-width="4"/><rect x="577" y="99" width="215" height="83" rx="12" fill="#24534b"/><text x="685" y="147" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#eff7ff">中间点 xₜ</text><path d="M 795 140 h 42" stroke="#cbd9ee" stroke-width="4"/><path d="M 830 131 l 13 9 -13 9" stroke="#cbd9ee" fill="none" stroke-width="4"/><rect x="842" y="99" width="215" height="83" rx="12" fill="#454065"/><text x="950" y="147" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#eff7ff">速度场 MSE</text><rect x="47" y="312" width="215" height="83" rx="12" fill="#275272"/><text x="155" y="360" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#eff7ff">高斯噪声 x₁</text><path d="M 265 354 h 42" stroke="#cbd9ee" stroke-width="4"/><path d="M 300 345 l 13 9 -13 9" stroke="#cbd9ee" fill="none" stroke-width="4"/><rect x="312" y="312" width="215" height="83" rx="12" fill="#5b4932"/><text x="420" y="360" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#eff7ff">Action Expert</text><path d="M 530 354 h 42" stroke="#cbd9ee" stroke-width="4"/><path d="M 565 345 l 13 9 -13 9" stroke="#cbd9ee" fill="none" stroke-width="4"/><rect x="577" y="312" width="215" height="83" rx="12" fill="#24534b"/><text x="685" y="360" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#eff7ff">Euler 多步积分</text><path d="M 795 354 h 42" stroke="#cbd9ee" stroke-width="4"/><path d="M 830 345 l 13 9 -13 9" stroke="#cbd9ee" fill="none" stroke-width="4"/><rect x="842" y="312" width="215" height="83" rx="12" fill="#454065"/><text x="950" y="360" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#eff7ff">最终动作块 A</text><text x="55" y="216" font-family="sans-serif" font-size="16" fill="#a8bbd7">训练不需要先做多步积分，直接构造速度监督。</text><text x="55" y="443" font-family="sans-serif" font-size="16" fill="#a8bbd7">每次积分更新的是整个 Action Chunk，而不是只更新一个动作标量。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><title>A³-VLA | Offline labels → training → deployment</title><rect width="1100" height="560" rx="18" fill="#f6f9ff"/><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#17365d}.head{font-size:30px;font-weight:bold}.sub{font-size:17px}.label{font-size:21px;font-weight:bold}.small{font-size:16px}</style><text x="40" y="50" class="head">A³-VLA | Offline labels → training → deployment</text><text x="40" y="82" class="sub">Future frames are used for supervision only, not as policy inputs.</text><rect x="35" y="115" width="300" height="105" rx="12" fill="#fff0d5" stroke="#6484a6"/><text x="51" y="149" class="label">1. Interaction event</text><text x="51" y="179" class="small">Gripper/contact + video</text><text x="51" y="203" class="small">Pre/post patch differences</text><rect x="400" y="115" width="300" height="105" rx="12" fill="#fff0d5" stroke="#6484a6"/><text x="416" y="149" class="label">2. SAM2 refinement</text><text x="416" y="179" class="small">Separate object/body IDs</text><text x="416" y="203" class="small">Cache masks and validity</text><rect x="765" y="115" width="300" height="105" rx="12" fill="#fff0d5" stroke="#6484a6"/><text x="781" y="149" class="label">3. Patch mapping</text><text x="781" y="179" class="small">Same crop/resize as image</text><text x="781" y="203" class="small">Coverage &gt; 25%</text><rect x="35" y="295" width="300" height="105" rx="12" fill="#e0eeff" stroke="#6484a6"/><text x="51" y="329" class="label">4. Current observation</text><text x="51" y="359" class="small">Images, language, state</text><text x="51" y="383" class="small">No future pixels</text><rect x="400" y="295" width="300" height="105" rx="12" fill="#e0eeff" stroke="#6484a6"/><text x="416" y="329" class="label">5. VLA forward</text><text x="416" y="359" class="small">Action expert + attention</text><text x="416" y="383" class="small">Region and semantic losses</text><rect x="765" y="295" width="300" height="105" rx="12" fill="#dcf5e9" stroke="#6484a6"/><text x="781" y="329" class="label">6. Deploy policy</text><text x="781" y="359" class="small">Only current observation</text><text x="781" y="383" class="small">Original action interface</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#526f90"/></marker></defs><path d="M335 167 L400 167" stroke="#526f90" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M700 167 L765 167" stroke="#526f90" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M915 220 L620 295" stroke="#526f90" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M335 348 L400 348" stroke="#526f90" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M700 348 L765 348" stroke="#526f90" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="40" y="476" class="label">EGO adaptation: compensate camera motion before differencing.</text><text x="40" y="508" class="small">Missing or uncertain masks: skip auxiliary loss, retain valid action supervision.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1470 620" role="img" aria-label="Fast-WAM Sparse8 与 Dense4 视觉序列：动作32步不变、未来图像时刻不同"><defs><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#eaf6ff}.ttl{font-size:32px;font-weight:bold}.lb{font-size:22px}.sm{font-size:18px}</style></defs><rect width="1470" height="620" fill="#13233a"/><text x="42" y="55" class="ttl">Fast-WAM：预测同一个 32 步未来，为什么只用 4 张图？</text><text x="42" y="102" class="lb">动作目标完全相同：[B,32,Dₐ]；变化的是视觉时间密度、VAE latent 布局和 Attention token 开销。</text><text x="42" y="163" class="lb">Dense：预测未来 8 帧（步长 4）</text><line x1="230" y1="229" x2="1350" y2="229" stroke="#829bb8" stroke-width="3"/><text x="44" y="237" class="lb">t = 0</text><g fill="#4b8fa0" stroke="#8ad4ec" stroke-width="2"><rect x="290" y="194" width="68" height="68" rx="9"/><text x="324" y="282" class="sm" text-anchor="middle">+4</text><rect x="425" y="194" width="68" height="68" rx="9"/><text x="459" y="282" class="sm" text-anchor="middle">+8</text><rect x="560" y="194" width="68" height="68" rx="9"/><text x="594" y="282" class="sm" text-anchor="middle">+12</text><rect x="695" y="194" width="68" height="68" rx="9"/><text x="729" y="282" class="sm" text-anchor="middle">+16</text><rect x="830" y="194" width="68" height="68" rx="9"/><text x="864" y="282" class="sm" text-anchor="middle">+20</text><rect x="965" y="194" width="68" height="68" rx="9"/><text x="999" y="282" class="sm" text-anchor="middle">+24</text><rect x="1100" y="194" width="68" height="68" rx="9"/><text x="1134" y="282" class="sm" text-anchor="middle">+28</text><rect x="1235" y="194" width="68" height="68" rx="9"/><text x="1269" y="282" class="sm" text-anchor="middle">+32</text></g><text x="43" y="333" class="lb">Sparse8：预测未来 4 帧（步长 8）</text><line x1="230" y1="402" x2="1350" y2="402" stroke="#829bb8" stroke-width="3"/><g fill="#416e56" stroke="#92c7a0" stroke-width="2"><rect x="358" y="367" width="68" height="68" rx="9"/><text x="392" y="456" class="sm" text-anchor="middle">+8</text><rect x="628" y="367" width="68" height="68" rx="9"/><text x="662" y="456" class="sm" text-anchor="middle">+16</text><rect x="898" y="367" width="68" height="68" rx="9"/><text x="932" y="456" class="sm" text-anchor="middle">+24</text><rect x="1168" y="367" width="68" height="68" rx="9"/><text x="1202" y="456" class="sm" text-anchor="middle">+32</text></g><text x="49" y="510" class="lb">Dense：9 帧含当前帧 → 196 未来视觉 token；Sparse：5 帧含当前帧 → 98 未来视觉 token。</text><text x="49" y="549" class="lb">论文消融 LIBERO-Plus：Dense 72.90% → Sparse 78.09%（同为 32 步动作 horizon）。</text><text x="49" y="586" class="sm">教学重绘，依据 arXiv:2610.15794 Appendix A.2 / Table 7。仅统计未来视觉 token，不含当前帧 token 和动作 token。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" role="img" aria-label="EgoX的trunk queries、动作预测60帧以及dream未来offset的三轴区别"><rect width="1040" height="490" fill="#f8fafc"/><text x="28" y="43" font-size="25" font-family="sans-serif" font-weight="bold" fill="#203b51">不要混淆三种时间 / Query 轴</text><text x="28" y="70" font-size="16" font-family="sans-serif" fill="#537188">共同 trunk 表示 → 字段专有动作序列；未来监督单独 Mask</text>
<text x="28" y="113" font-size="19" font-family="sans-serif" font-weight="bold" fill="#285c88">A. Trunk 的字段 Query 预算</text>
<rect x="28" y="127" width="229" height="61" rx="8" fill="#d8eaf8"/><rect x="268" y="127" width="229" height="61" rx="8" fill="#c9e2f3"/><rect x="508" y="127" width="229" height="61" rx="8" fill="#bed9ec"/><rect x="748" y="127" width="264" height="61" rx="8" fill="#d8eaf8"/><text x="43" y="153" font-size="16" font-family="sans-serif" fill="#234d6a">body pose</text><text x="43" y="176" font-size="16" font-family="sans-serif" fill="#234d6a">24 queries</text><text x="283" y="153" font-size="16" font-family="sans-serif" fill="#234d6a">left/right EEF</text><text x="283" y="176" font-size="16" font-family="sans-serif" fill="#234d6a">24 queries each</text><text x="523" y="153" font-size="16" font-family="sans-serif" fill="#234d6a">hand links</text><text x="523" y="176" font-size="16" font-family="sans-serif" fill="#234d6a">30 queries each</text><text x="763" y="153" font-size="16" font-family="sans-serif" fill="#234d6a">velocity (if present)</text><text x="763" y="176" font-size="16" font-family="sans-serif" fill="#234d6a">30 queries</text>
<text x="28" y="240" font-size="19" font-family="sans-serif" font-weight="bold" fill="#247351">B. ActionHead 预测 60 帧（时间与字段维度均 Mask）</text><rect x="29" y="255" width="983" height="47" rx="8" fill="#d9f1e4" stroke="#9fc8b5"/><path d="M193 255V302M357 255V302M521 255V302M685 255V302M849 255V302" stroke="#9fc8b5" stroke-width="2"/><text x="49" y="283" font-family="sans-serif" font-size="16" fill="#226348">0…9</text><text x="215" y="283" font-family="sans-serif" font-size="16" fill="#226348">10…19</text><text x="379" y="283" font-family="sans-serif" font-size="16" fill="#226348">20…29</text><text x="543" y="283" font-family="sans-serif" font-size="16" fill="#226348">30…39</text><text x="707" y="283" font-family="sans-serif" font-size="16" fill="#226348">40…49</text><text x="870" y="283" font-family="sans-serif" font-size="16" fill="#226348">50…59</text><text x="30" y="328" font-size="15" font-family="sans-serif" fill="#587469">例如 episode 剩余 15 帧，则后面 45 帧 loss 不能计算。</text>
<text x="28" y="371" font-size="19" font-family="sans-serif" font-weight="bold" fill="#a35458">C. Dreaming 训练未来偏移：20 / 40 / 60 帧</text><path d="M83 406H951" stroke="#adbeca" stroke-width="4"/><circle cx="83" cy="406" r="9" fill="#305572"/><circle cx="373" cy="406" r="9" fill="#b86162"/><circle cx="664" cy="406" r="9" fill="#b86162"/><circle cx="950" cy="406" r="9" fill="#b86162"/><text x="57" y="435" font-size="16" font-family="sans-serif" fill="#305572">t</text><text x="340" y="435" font-size="16" font-family="sans-serif" fill="#a35458">t+20</text><text x="630" y="435" font-size="16" font-family="sans-serif" fill="#a35458">t+40</text><text x="919" y="435" font-size="16" font-family="sans-serif" fill="#a35458">t+60</text><text x="29" y="471" font-size="15" font-family="sans-serif" fill="#82545b">超出 episode → dream_pad=True → 未来潜变量 supervision 不产生梯度；不是用最后一帧当真值。</text></svg>
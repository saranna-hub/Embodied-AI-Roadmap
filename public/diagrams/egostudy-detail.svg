<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="108D 几何合同：腕部运动与指尖手型解耦"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="1000" height="490" rx="18" fill="#f8fafc"/><g font-family="sans-serif"><text x="32" y="42" font-size="26" font-weight="bold" fill="#0f172a">108D 几何合同：腕部运动与指尖手型解耦</text><text x="32" y="72" font-size="15" fill="#475569">每手 6 个位姿，每个位姿 3D 平移 + 6D 旋转；双手 108D</text><path d="M180 188V225H250V250" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M500 188V225H375V250" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M180 188V210H625V250" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M820 188V250" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M250 332V350H405V365" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M740 332V350H595V365" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="110" width="300" height="78" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="180" y="138" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">世界系腕部起点与目标</text><text x="180" y="162" text-anchor="middle" font-size="14" fill="#334155">p_w(0), R_w(0), p_w(t), R_w(t)</text><rect x="350" y="110" width="300" height="78" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="500" y="138" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">起始相机 C0</text><text x="500" y="162" text-anchor="middle" font-size="14" fill="#334155">冻结旋转 R_c,0</text><rect x="670" y="110" width="300" height="78" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="820" y="138" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">世界系五指目标</text><text x="820" y="162" text-anchor="middle" font-size="14" fill="#334155">p_f(t), R_f(t)</text><rect x="40" y="250" width="435" height="82" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="257.5" y="278" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">腕部 9D / 手</text><text x="257.5" y="302" text-anchor="middle" font-size="14" fill="#334155">位移和主动相对旋转均在 C0 表达</text><rect x="525" y="250" width="435" height="82" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="742.5" y="278" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">指尖 45D / 手</text><text x="742.5" y="302" text-anchor="middle" font-size="14" fill="#334155">随时刻 t 的腕系表达局部位姿</text><rect x="275" y="365" width="450" height="70" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="500" y="393" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">拼接左右手，32 × 108</text><text x="500" y="417" text-anchor="middle" font-size="14" fill="#334155">旋转前两列编码 · 有效性 mask</text><text x="32" y="465" font-size="15" fill="#334155">注意：起始相机不是逐帧相机；指尖局部几何不代表机器人关节可直接执行。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-label="UMI双Tracker坐标变换到机器人TCP和世界系">
<rect width="1200" height="530" fill="#081526"/><text x="50" y="57" fill="#e9f3ff" font-family="sans-serif" font-size="31" font-weight="bold">UMI 双 Tracker → TCP → 机器人 Base</text><text x="50" y="92" fill="#a3bbd7" font-family="sans-serif" font-size="17">固定标定：T_WL、T_UE、T_RW；动态采样：T_LU(t)</text>
<g font-family="sans-serif" font-size="20" text-anchor="middle">
<rect x="54" y="168" width="190" height="96" rx="13" fill="#153857" stroke="#6ebaf0" stroke-width="2"/><text x="149" y="205" fill="#cceaff">Lighthouse L</text><text x="149" y="235" fill="#7ecdf5" font-size="16">追踪原点 / 时钟</text>
<rect x="340" y="128" width="230" height="105" rx="13" fill="#183c4e" stroke="#41d6c3" stroke-width="2"/><text x="455" y="163" fill="#d4fff7">左 Tracker Uₗ</text><text x="455" y="193" fill="#7ef4d3" font-size="16">T_LUₗ(t)</text>
<rect x="340" y="280" width="230" height="105" rx="13" fill="#183c4e" stroke="#41d6c3" stroke-width="2"/><text x="455" y="316" fill="#d4fff7">右 Tracker Uᵣ</text><text x="455" y="346" fill="#7ef4d3" font-size="16">T_LUᵣ(t)</text>
<rect x="683" y="128" width="207" height="105" rx="13" fill="#39355b" stroke="#c7a8ff" stroke-width="2"/><text x="786" y="163" fill="#eadbff">左工具 TCP Eₗ</text><text x="786" y="193" fill="#ceb7f9" font-size="16">T_UₗEₗ 固定外参</text>
<rect x="683" y="280" width="207" height="105" rx="13" fill="#39355b" stroke="#c7a8ff" stroke-width="2"/><text x="786" y="316" fill="#eadbff">右工具 TCP Eᵣ</text><text x="786" y="346" fill="#ceb7f9" font-size="16">T_UᵣEᵣ 固定外参</text>
<rect x="971" y="181" width="190" height="142" rx="13" fill="#463c25" stroke="#ffd484" stroke-width="2"/><text x="1066" y="218" fill="#fff2d4">工位 W → 基座 R</text><text x="1066" y="250" fill="#ffd48b" font-size="16">T_WL + T_RW</text><text x="1066" y="281" fill="#ffe3a6" font-size="16">Replay / Action</text>
</g><g fill="none" stroke-width="3" stroke-linecap="round"><path d="M244 216 L290 216 L290 182 L340 182" stroke="#6ebaf0"/><path d="M244 216 L290 216 L290 334 L340 334" stroke="#6ebaf0"/><path d="M570 182 H683" stroke="#7ef4d3"/><path d="M570 334 H683" stroke="#7ef4d3"/><path d="M890 180 L928 180 L928 223 L971 223" stroke="#c7a8ff"/><path d="M890 332 L928 332 L928 285 L971 285" stroke="#c7a8ff"/></g>
<text x="52" y="454" font-size="19" fill="#ddeaff" font-family="sans-serif">T_RE^(h)(t) = T_RW · T_WL · T_LU^(h)(t) · T_UE^(h)</text>
<text x="52" y="488" font-size="16" fill="#ffcb86" font-family="sans-serif">注意：Pivot 只解 TCP 的位置偏移；TCP 朝向需要单独标定。双手禁止共用工具外参。</text></svg>
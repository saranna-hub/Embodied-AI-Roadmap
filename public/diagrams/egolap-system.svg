<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="EgoLAP system diagram showing human and robot inputs, language action and reasoning auxiliary targets, flow matching expert, train and inference">

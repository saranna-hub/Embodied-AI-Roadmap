<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 620" role="img" aria-labelledby="t d"><title id="t">EgoSim 52-channel latent and state update guards</title><desc id="d">Noise, patch mask, masked scene, and skeleton latent form 52 channels. A rollback gate prevents untrusted generated observations from contaminating persistent 3D state.</desc><rect width="1220" height="620" rx="26" fill="#091627"/><text x="45" y="58" font-family="Arial" font-size="29" font-weight="700" fill="#f9fafb">EgoSim | 52ch conditioning / temporal overlap / state quality</text><text x="46" y="87" font-family="Arial" font-size="15" fill="#a5bbd5">Reverse-engineered from official inference source · conceptual time diagram</text>
<text x="47" y="144" font-family="Arial" font-weight="700" font-size="21" fill="#dbeafe">Model input: B × 52 × F' × H' × W'</text>
<rect x="49" y="171" width="257" height="86" rx="10" fill="#125482"/><rect x="311" y="171" width="136" height="86" rx="10" fill="#195d69"/><rect x="452" y="171" width="340" height="86" rx="10" fill="#1b766d"/><rect x="797" y="171" width="376" height="86" rx="10" fill="#7054a8"/><text x="67" y="208" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Noisy latent</text><text x="68" y="237" fill="#c7f0ff" font-size="18" font-family="Arial">16 channels</text><text x="331" y="210" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Mask</text><text x="332" y="237" fill="#c7f0ff" font-family="Arial" font-size="17">4 channels</text><text x="473" y="211" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Scene × (1-mask)</text><text x="475" y="238" fill="#c7f0ff" font-family="Arial" font-size="17">16 channels</text><text x="824" y="211" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Hand / tool skeleton</text><text x="827" y="238" fill="#e6d8ff" font-family="Arial" font-size="17">16 channels</text>
<text x="49" y="294" fill="#89a6c7" font-family="Arial" font-size="16">Mask: unknown pixels = 1; known scene pixels = 0. First frame explicitly unmasked in runner.</text>
<line x1="50" y1="322" x2="1172" y2="322" stroke="#34506f" stroke-width="2"/>
<text x="50" y="359" fill="#dbeafe" font-family="Arial" font-size="22" font-weight="700">Clip boundary: a shared frame must not be counted twice</text><rect x="50" y="379" width="524" height="52" rx="8" fill="#126485"/><rect x="574" y="379" width="524" height="52" rx="8" fill="#5e4793"/><rect x="566" y="368" width="16" height="76" fill="#fcd34d"/><text x="65" y="411" fill="#fff" font-family="Arial" font-size="18">clip k: 0 ... 60</text><text x="597" y="411" fill="#fff" font-family="Arial" font-size="18">clip k+1: 60 ... 120</text><text x="50" y="461" fill="#9bd9e8" font-size="18" font-family="Arial">61 + 61 − 1 = 121 unique frames (when overlap is one endpoint)</text>
<line x1="50" y1="481" x2="1172" y2="481" stroke="#34506f" stroke-width="2"/><rect x="50" y="501" width="333" height="66" rx="12" fill="#214658"/><rect x="442" y="501" width="326" height="66" rx="12" fill="#315a5a"/><rect x="827" y="501" width="344" height="66" rx="12" fill="#553d54"/><text x="72" y="542" fill="#e6f5ff" font-size="19" font-family="Arial">Candidate state update</text><text x="465" y="542" fill="#d1fae5" font-size="19" font-family="Arial">Geometry / mask QC gate</text><text x="851" y="530" fill="#ffebb5" font-size="18" font-family="Arial">PASS: commit new S(k)</text><text x="851" y="553" fill="#ffb5b5" font-size="18" font-family="Arial">FAIL: keep old S(k-1)</text><path d="M384 534 H438" stroke="#76e6d3" stroke-width="4"/><path d="M428 525 l10 9 -10 9" stroke="#76e6d3" fill="none" stroke-width="4"/><path d="M768 534 H823" stroke="#76e6d3" stroke-width="4"/><path d="M813 525 l10 9 -10 9" stroke="#76e6d3" fill="none" stroke-width="4"/><text x="50" y="602" fill="#91a9c8" font-size="14" font-family="Arial">Quality gate is a suggested production safety extension; source reconstruction does not guarantee physics consistency.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1020" role="img" aria-label="π₀详细模型结构图：输入图像语言状态和动作噪声，经视觉编码器、PaliGemma、Action Expert联合注意力，训练速度场并在推理时积分生成机器人动作">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#9cc5ea"/></marker></defs>
<style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif}.title{font-size:29px;font-weight:bold;fill:#f3f8ff}.section{font-size:21px;font-weight:bold;fill:#edf6ff}.node{font-size:18px;font-weight:bold;fill:#f3f8ff}.minor{font-size:14px;fill:#c9d9ed}.caption{font-size:16px;fill:#b5c9e2}</style>
<rect width="1320" height="1020" rx="22" fill="#0f1b2f"/><text x="42" y="51" class="title">π₀ 完整计算图｜输入 → 编码 → 双专家 → 速度预测 → 动作</text>
<rect x="26" y="76" width="1268" height="380" rx="19" fill="#14243b" stroke="#375273"/>
<text x="47" y="109" class="section">① 输入与 Token 构造（Observation + Noisy Action）</text>
<rect x="48" y="140" width="220" height="72" rx="13" fill="#224268" stroke="#63809e" stroke-width="1.4"/><text x="158" y="169" class="node" text-anchor="middle">N 路 RGB 相机</text><text x="158" y="192" class="minor" text-anchor="middle">[B,N,3,H,W]</text>
<rect x="48" y="238" width="220" height="72" rx="13" fill="#224268" stroke="#63809e" stroke-width="1.4"/><text x="158" y="267" class="node" text-anchor="middle">语言指令</text><text x="158" y="290" class="minor" text-anchor="middle">文本 / token [B,L]</text>
<rect x="48" y="336" width="220" height="72" rx="13" fill="#205347" stroke="#63809e" stroke-width="1.4"/><text x="158" y="365" class="node" text-anchor="middle">Robot State</text><text x="158" y="388" class="minor" text-anchor="middle">[B, Ds]</text>
<rect x="333" y="140" width="250" height="72" rx="13" fill="#254f78" stroke="#63809e" stroke-width="1.4"/><text x="458" y="169" class="node" text-anchor="middle">SigLIP 视觉编码</text><text x="458" y="192" class="minor" text-anchor="middle">patch tokens</text>
<rect x="333" y="238" width="250" height="72" rx="13" fill="#254f78" stroke="#63809e" stroke-width="1.4"/><text x="458" y="267" class="node" text-anchor="middle">Tokenizer + Embedding</text><text x="458" y="290" class="minor" text-anchor="middle">language tokens</text>
<rect x="333" y="336" width="250" height="72" rx="13" fill="#225e52" stroke="#63809e" stroke-width="1.4"/><text x="458" y="365" class="node" text-anchor="middle">State Linear Projection</text><text x="458" y="388" class="minor" text-anchor="middle">state embedding</text>
<path d="M268 176 L333 176" stroke="#9cc5ea" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M268 274 L333 274" stroke="#9cc5ea" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M268 372 L333 372" stroke="#9cc5ea" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="642" y="131" width="609" height="192" rx="16" fill="#1a3454" stroke="#648db9"/>
<text x="660" y="165" class="section">② Prefix：预训练 PaliGemma 视觉语言专家</text>
<text x="660" y="203" class="node">Vision tokens + Language tokens</text><text x="660" y="235" class="minor">Gemma 2B 视觉语言 Transformer（权重与 Action Expert 分离）</text>
<text x="660" y="268" class="minor">输出：条件上下文表示 / Prefix K,V</text>
<path d="M583 176 L642 176" stroke="#9cc5ea" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M583 274 L642 274" stroke="#9cc5ea" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="642" y="339" width="609" height="90" rx="15" fill="#1a443e" stroke="#5ea992"/>
<text x="662" y="372" class="node">③ Suffix 输入：state embed + noisy action xₜ + time t</text>
<text x="662" y="398" class="minor">xₜ ∈ R[B,H,D]；每个动作时间步对应动作侧 token（投影/嵌入）</text>
<path d="M583 372 L642 372" stroke="#9cc5ea" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="26" y="478" width="1268" height="180" rx="19" fill="#142d34" stroke="#417e83"/>
<text x="47" y="510" class="section">④ 双专家联合计算：受控 Attention Mask（不是 Router MoE）</text>
<rect x="50" y="534" width="336" height="89" rx="13" fill="#234668" stroke="#63809e" stroke-width="1.4"/><text x="218" y="563" class="node" text-anchor="middle">Prefix Transformer</text><text x="218" y="586" class="minor" text-anchor="middle">视觉语言语义条件</text>
<rect x="490" y="534" width="337" height="89" rx="13" fill="#294663" stroke="#63809e" stroke-width="1.4"/><text x="658.5" y="563" class="node" text-anchor="middle">受控联合注意力</text><text x="658.5" y="586" class="minor" text-anchor="middle">Prefix 不读取带噪 Suffix</text>
<rect x="933" y="534" width="331" height="89" rx="13" fill="#206055" stroke="#63809e" stroke-width="1.4"/><text x="1098.5" y="563" class="node" text-anchor="middle">Action Expert / Gemma 300M</text><text x="1098.5" y="586" class="minor" text-anchor="middle">输出速度 vθ(xₜ,t,o) [B,H,D]</text>
<path d="M386 581 L490 581" stroke="#9cc5ea" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M827 581 L933 581" stroke="#9cc5ea" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="49" y="647" class="caption">Prefix → Prefix 可见；Prefix → Suffix 禁止；Suffix → Prefix 可见；Suffix → Suffix 按具体 Mask 分组规则</text>
<rect x="26" y="679" width="620" height="298" rx="19" fill="#243043" stroke="#547293"/>
<text x="45" y="715" class="section">⑤ 训练：直接监督速度场（单步采样 t）</text>
<rect x="45" y="739" width="272" height="73" rx="13" fill="#245075" stroke="#63809e" stroke-width="1.4"/><text x="181" y="768" class="node" text-anchor="middle">真值 Action Chunk A</text><text x="181" y="791" class="minor" text-anchor="middle">[B,H,D]</text>
<rect x="347" y="739" width="273" height="73" rx="13" fill="#604b33" stroke="#63809e" stroke-width="1.4"/><text x="483.5" y="768" class="node" text-anchor="middle">ε~N(0,I), t</text><text x="483.5" y="791" class="minor" text-anchor="middle">噪声、时间采样</text>
<text x="45" y="853" class="node">xₜ = (1−t) A + t ε</text><text x="45" y="886" class="node">目标速度 u = ε − A</text>
<text x="45" y="926" class="minor">Loss：MSE( vθ(xₜ,t,o), ε−A )</text>
<rect x="671" y="679" width="623" height="298" rx="19" fill="#27363b" stroke="#4d967e"/>
<text x="693" y="715" class="section">⑥ 推理：反向时间 ODE 多次积分</text>
<rect x="693" y="739" width="260" height="73" rx="13" fill="#584735" stroke="#63809e" stroke-width="1.4"/><text x="823" y="768" class="node" text-anchor="middle">x₁ ~ N(0,I)</text><text x="823" y="791" class="minor" text-anchor="middle">初始化完整动作块</text>
<rect x="994" y="739" width="275" height="73" rx="13" fill="#205b51" stroke="#63809e" stroke-width="1.4"/><text x="1131.5" y="768" class="node" text-anchor="middle">Action Expert</text><text x="1131.5" y="791" class="minor" text-anchor="middle">每步重新预测速度</text>
<path d="M953 773 L994 773" stroke="#9cc5ea" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="694" y="853" class="node">xₜ₋Δ = xₜ − Δ · vθ(xₜ,t,o)</text>
<text x="694" y="886" class="minor">循环 K 次，输出 Â [B,H,D] → 反归一化 / 控制接口</text>
<text x="694" y="924" class="minor">H=50 是动作步数；K=10 等是积分次数，两者独立</text>
<text x="39" y="1005" font-size="14" fill="#9eb4cd">示意为概念级结构；具体视觉 token 数、Mask 细节、归一化与配置须以所用 openpi commit 为准。</text>
</svg>
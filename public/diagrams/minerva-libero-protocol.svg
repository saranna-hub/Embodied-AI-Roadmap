<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img" aria-labelledby="t d"><title id="t">MINERVA 标准成绩、任务 ID 反事实与扰动评测</title><desc id="d">对比标准 LIBERO 高分、任务编号置换导致性能下降、LIBERO-Plus 光照与相机变化导致崩溃，以及样本数量与训练种子区别。</desc><rect width="1400" height="730" fill="#0d1727"/><rect x="22" y="22" width="1356" height="690" rx="24" fill="#14263c" stroke="#345570" stroke-width="2"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif"><text x="700" y="68" fill="#fff" font-size="31" font-weight="bold" text-anchor="middle">95% 的正确解释：封闭任务成功 ≠ 开放场景泛化</text><text x="700" y="105" fill="#acc6dc" font-size="19" text-anchor="middle">同一篇论文的三组证据，必须分别统计</text>
<rect x="54" y="156" width="401" height="324" rx="19" fill="#214764" stroke="#5ab5ea" stroke-width="2"/><text x="254" y="203" fill="#eaf8ff" font-size="26" font-weight="bold" text-anchor="middle">标准 LIBERO</text><text x="254" y="255" fill="#fff" font-size="48" font-weight="bold" text-anchor="middle">95.05%</text><text x="254" y="297" fill="#d6ecff" font-size="20" text-anchor="middle">0.54M · 40 个已知任务</text><text x="254" y="331" fill="#d6ecff" font-size="20" text-anchor="middle">50 episodes × 40 = 2000</text><rect x="91" y="364" width="325" height="80" rx="13" fill="#11314b"/><text x="254" y="399" fill="#bde2ff" font-size="18" text-anchor="middle">π₀.₅ 97.50% 为 400 次</text><text x="254" y="426" fill="#bde2ff" font-size="18" text-anchor="middle">外部参考，非同协议比较</text>
<rect x="500" y="156" width="401" height="324" rx="19" fill="#3b3d5b" stroke="#aba7ee" stroke-width="2"/><text x="700" y="203" fill="#f5efff" font-size="26" font-weight="bold" text-anchor="middle">任务 ID 置换探针</text><text x="700" y="253" fill="#fff" font-size="39" font-weight="bold" text-anchor="middle">96.75 → 6.5%</text><text x="700" y="297" fill="#e5dcff" font-size="20" text-anchor="middle">冻结 1M 模型所有权重</text><text x="700" y="331" fill="#e5dcff" font-size="20" text-anchor="middle">只将同 suite 的 ID 轮换</text><rect x="537" y="364" width="325" height="80" rx="13" fill="#252743"/><text x="700" y="401" fill="#dcd9ff" font-size="19" text-anchor="middle">提示主要承担任务选择</text><text x="700" y="428" fill="#dcd9ff" font-size="18" text-anchor="middle">不能推出理解新指令</text>
<rect x="946" y="156" width="401" height="324" rx="19" fill="#5a3429" stroke="#efa47e" stroke-width="2"/><text x="1146" y="203" fill="#fff2e9" font-size="26" font-weight="bold" text-anchor="middle">LIBERO-Plus 扰动</text><text x="1146" y="253" fill="#fff" font-size="44" font-weight="bold" text-anchor="middle">46.7%</text><text x="1146" y="297" fill="#ffe3d5" font-size="20" text-anchor="middle">相机变化 11.5%</text><text x="1146" y="331" fill="#ffe3d5" font-size="20" text-anchor="middle">光照变化仅 1.1%</text><rect x="983" y="364" width="325" height="80" rx="13" fill="#40271f"/><text x="1146" y="401" fill="#ffd1ba" font-size="19" text-anchor="middle">训练视觉分布之外</text><text x="1146" y="428" fill="#ffd1ba" font-size="18" text-anchor="middle">记忆式策略很容易失效</text>
<rect x="95" y="524" width="1210" height="125" rx="19" fill="#263c45" stroke="#78acaf" stroke-width="1.7"/><text x="700" y="566" fill="#f2fffa" font-size="23" font-weight="bold" text-anchor="middle">可靠评测：固定初始化 + 每任务成功率 + 多训练 seed + 视觉扰动</text><text x="700" y="610" fill="#cfebe4" font-size="19" text-anchor="middle">论文关键消融存在约 ±1 个百分点的 seed 波动；小于该尺度的单次涨点不应过度解释</text>
<text x="700" y="683" fill="#b2cadb" font-size="17" text-anchor="middle">数值来自 MINERVA arXiv:2609.03715 Tables I / II / IV，均为作者报告，不是本站实测</text></g></svg>
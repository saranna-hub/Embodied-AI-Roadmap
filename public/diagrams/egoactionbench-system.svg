<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-label="EgoActionBench data annotation evaluation and adaptation pipeline">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1630"/><stop offset="1" stop-color="#172d52"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#82add6"/></marker></defs>
<rect width="1200" height="690" rx="22" fill="url(#bg)"/>
<g font-family="Arial,Microsoft YaHei,sans-serif">
<text x="48" y="66" font-size="32" font-weight="700" fill="#f4f8ff">EgoActionBench · What / When / Which Hand</text>
<text x="49" y="99" font-size="16" fill="#b5c9e6">Human-refined benchmark  |  separate auto-labeled adaptation set  |  NOT executable robot actions</text>
<rect x="48" y="134" width="216" height="145" rx="15" fill="#243d61" stroke="#628eb8"/>
<text x="66" y="167" font-size="23" font-weight="700" fill="#fff">Source video</text>
<text x="66" y="199" font-size="17" fill="#d2e4ff">Ego4D / EgoLife</text><text x="66" y="224" font-size="17" fill="#d2e4ff">EPIC-KITCHENS</text><text x="66" y="250" font-size="14" fill="#a9d8ff">fps + parent clip ID</text>
<rect x="323" y="134" width="258" height="145" rx="15" fill="#224858" stroke="#56c7c4"/>
<text x="340" y="167" font-size="23" font-weight="700" fill="#fff">Hand-aware drafts</text>
<text x="340" y="200" font-size="16" fill="#d6f8f7">CaRe-Ego hand masks</text>
<text x="340" y="226" font-size="16" fill="#d6f8f7">1s sliding VLM windows</text>
<text x="340" y="252" font-size="16" fill="#d6f8f7">Left / Right / Both</text>
<rect x="643" y="134" width="242" height="145" rx="15" fill="#384367" stroke="#a0a4ef"/>
<text x="660" y="167" font-size="22" font-weight="700" fill="#fff">Human + Agent QC</text>
<text x="660" y="200" font-size="16" fill="#e9e5ff">review boundaries</text>
<text x="660" y="226" font-size="16" fill="#e9e5ff">contact + object changes</text>
<text x="660" y="252" font-size="16" fill="#e9e5ff">evidence frames, revision</text>
<rect x="943" y="134" width="208" height="145" rx="15" fill="#3b4d42" stroke="#81d6ad"/>
<text x="960" y="167" font-size="21" font-weight="700" fill="#fff">Gold benchmark</text>
<text x="960" y="202" font-size="17" fill="#d9ffe7">1,407 episodes</text>
<text x="960" y="229" font-size="17" fill="#d9ffe7">41,132 atomic actions</text>
<text x="960" y="256" font-size="15" fill="#b6eed2">7.982 hours</text>
<path d="M265 206 H320 M582 206 H640 M886 206 H940" fill="none" stroke="#82add6" stroke-width="3" marker-end="url(#a)"/>
<text x="48" y="340" font-size="21" fill="#fff" font-weight="700">Assessment: content can match even when timestamps are poor</text>
<rect x="48" y="363" width="510" height="145" rx="14" fill="#1c3554" stroke="#568ab3"/>
<text x="67" y="393" font-size="20" font-weight="700" fill="#e8f4ff">Semantic branch</text>
<text x="67" y="425" font-size="17" fill="#cde0fb">Omin ≥ 0.5 → hand-track compatibility</text>
<text x="67" y="451" font-size="17" fill="#cde0fb">Verb / Objects / Tools / Motion judge</text>
<text x="67" y="478" font-size="17" fill="#cde0fb">selected caption + matching hand</text>
<rect x="592" y="363" width="559" height="145" rx="14" fill="#1c3554" stroke="#568ab3"/>
<text x="611" y="393" font-size="20" font-weight="700" fill="#e8f4ff">Temporal branch</text>
<text x="611" y="425" font-size="17" fill="#cde0fb">original interval tIoU / all GT denominator</text>
<text x="611" y="451" font-size="17" fill="#cde0fb">one-to-one max matching → micro F1</text>
<text x="611" y="478" font-size="17" fill="#cde0fb">EgoActionScore = mean(Semantic, Temporal)</text>
<rect x="48" y="551" width="1103" height="91" rx="14" fill="#27435f" stroke="#8db8de"/>
<text x="67" y="584" font-size="20" fill="#fff" font-weight="700">Separate adaptation track</text>
<text x="67" y="615" font-size="17" fill="#dceaff">5,354 auto-labeled videos → frozen vision + SFT (LLM/connector) → GRPO (LLM only) → caption predictions</text>
</g></svg>